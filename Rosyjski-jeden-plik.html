<script>/* js\store.js */
(function () {
/* ============================================================
   STAN — wszystko trzymane lokalnie w przeglądarce
   ============================================================ */

const KEY = 'russkij-put-v1';

const DEFAULTS = {
  v: 1,
  xp: 0,
  streak: 0,
  bestStreak: 0,
  lastDay: null,
  days: {},
  dailyGoal: 30,
  srs: {},
  mod: {},
  drill: {},
  exams: {},
  goals: {},
  refs: {},
  badges: {},
  notes: [],
  stats: { answered: 0, correct: 0, typed: 0, reviews: 0, bestCombo: 0, sessions: 0 },
  settings: { tts: true, autoSpeak: false, voice: null, accent: null },

  /* rozszerzenia: waluta, ekwipunek, zadania dnia, nowe tryby */
  coins: 0,
  inv: {},
  perks: {},
  quests: {},
  dstat: {},
  topics: {},
  kb: { chars: 0, errors: 0, bestCpm: 0, lessons: {} },
  sent: { done: 0, ok: 0, lvl: {} },
  reading: { texts: 0, added: 0, custom: [] },
};

let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(DEFAULTS);
    const parsed = JSON.parse(raw);
    /* Scalamy z domyślnymi, żeby zapis ze starszej wersji nie gubił nowych pól */
    return Object.assign(structuredClone(DEFAULTS), parsed, {
      stats: Object.assign({}, DEFAULTS.stats, parsed.stats || {}),
      settings: Object.assign({}, DEFAULTS.settings, parsed.settings || {}),
      kb: Object.assign({}, DEFAULTS.kb, parsed.kb || {}),
      sent: Object.assign({}, DEFAULTS.sent, parsed.sent || {}),
      reading: Object.assign({}, DEFAULTS.reading, parsed.reading || {}),
    });
  } catch (e) {
    console.warn('Nie udało się wczytać postępu, zaczynamy od zera.', e);
    return structuredClone(DEFAULTS);
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
    console.warn('Nie udało się zapisać postępu.', e);
  }
}

/* ------------------------------------------------------------
   Czas i passa
   ------------------------------------------------------------ */

const DAY = 86400000;

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function dayKey(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

function touchDay() {
  const t = today();
  if (S.lastDay === t) return;
  const yesterday = dayKey(new Date(Date.now() - DAY));
  S.streak = S.lastDay === yesterday ? S.streak + 1 : 1;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.lastDay = t;
}

function streakAlive() {
  if (!S.lastDay) return false;
  return S.lastDay === today() || S.lastDay === dayKey(new Date(Date.now() - DAY));
}

function todayCount() {
  return S.days[today()] || 0;
}

function dailyDone() {
  return todayCount() >= S.dailyGoal;
}

/* ------------------------------------------------------------
   Poziomy — rangi po rosyjsku
   ------------------------------------------------------------ */

const RANKS = [
  'Новичок', 'Ученик', 'Читатель', 'Собеседник', 'Знаток',
  'Мастер', 'Виртуоз', 'Профессор', 'Легенда', 'Носитель',
];

function levelCost(l) { return 120 + (l - 1) * 55; }

function levelInfo(xp) {
  let lvl = 1, rest = xp, need = levelCost(1);
  while (rest >= need) { rest -= need; lvl++; need = levelCost(lvl); }
  return {
    lvl,
    rest,
    need,
    pct: Math.round((rest / need) * 100),
    rank: RANKS[Math.min(lvl - 1, RANKS.length - 1)],
  };
}

function addXp(n) {
  const before = levelInfo(S.xp).lvl;
  S.xp += n;
  const after = levelInfo(S.xp);
  if (after.lvl > before) UI.levelUp(after);
  return after;
}

/* ------------------------------------------------------------
   Powtórki rozłożone w czasie
   Pudełka 0–5. Odstępy w dniach; pudełko 0 wraca po 10 minutach.
   Słowo uznajemy za „w pamięci”, gdy siedzi w pudełku 2 lub wyżej.
   ------------------------------------------------------------ */

const GAPS = [0.007, 1, 3, 7, 16, 40];
const KNOWN_BOX = 2;

function card(id) {
  if (!S.srs[id]) S.srs[id] = { b: 0, d: 0, s: 0, w: 0 };
  return S.srs[id];
}

function known(id) {
  const c = S.srs[id];
  return !!c && c.b >= KNOWN_BOX;
}

/* grade: 0 = nie znam, 1 = z trudem, 2 = dobrze, 3 = od ręki */
function grade(id, g) {
  const c = card(id);
  const firstTime = c.s === 0;
  c.s++;
  bump('rev');
  if (firstTime) bump('neu');
  if (g === 0) { c.w++; c.b = 0; }
  else if (g === 1) c.b = Math.max(0, c.b - 1);
  else if (g === 2) c.b = Math.min(5, c.b + 1);
  else c.b = Math.min(5, c.b + 2);
  c.d = Date.now() + GAPS[c.b] * DAY;
  S.stats.reviews++;
  return c;
}

function dueCards() {
  const now = Date.now();
  return Object.keys(S.srs).filter((id) => S.srs[id].d <= now && S.srs[id].s > 0);
}

function dueCount() {
  return dueCards().length;
}

function knownCount(catId) {
  let n = 0;
  for (const w of WORDS) {
    if (catId && w.cat !== catId) continue;
    if (known(w.id)) n++;
  }
  return n;
}

function seenCount(catId) {
  let n = 0;
  for (const w of WORDS) {
    if (catId && w.cat !== catId) continue;
    if (S.srs[w.id] && S.srs[w.id].s > 0) n++;
  }
  return n;
}

/* Słabe punkty — karty, które najczęściej wracają */
function weakWords(limit) {
  return Object.keys(S.srs)
    .filter((id) => S.srs[id].w > 0)
    .sort((a, b) => S.srs[b].w - S.srs[a].w || S.srs[a].b - S.srs[b].b)
    .slice(0, limit || 30)
    .map((id) => WORDS.find((w) => w.id === id))
    .filter(Boolean);
}

/* ------------------------------------------------------------
   Rejestrowanie odpowiedzi
   ------------------------------------------------------------ */

function logAnswer(ok) {
  touchDay();
  const t = today();
  S.days[t] = (S.days[t] || 0) + 1;
  S.stats.answered++;
  if (ok) S.stats.correct++;
}

/* ------------------------------------------------------------
   Moduły gramatyczne
   ------------------------------------------------------------ */

function modState(id) {
  if (!S.mod[id]) S.mod[id] = { sec: {}, };
  return S.mod[id];
}

function secDone(modId, i) {
  const m = S.mod[modId];
  return !!(m && m.sec && m.sec[i] != null);
}

function modSectionsDone(modId) {
  const m = S.mod[modId];
  if (!m || !m.sec) return 0;
  return Object.keys(m.sec).length;
}

function modComplete(modId) {
  const mod = MODULES.find((m) => m.id === modId);
  if (!mod) return false;
  return modSectionsDone(modId) >= mod.sections.length;
}

/* ------------------------------------------------------------
   Cele ścieżki
   ------------------------------------------------------------ */

function goalProgress(g) {
  switch (g.type) {
    case 'ref':
      return { now: S.refs[g.ref] ? 1 : 0, max: 1 };
    case 'module': {
      const mod = MODULES.find((m) => m.id === g.ref);
      if (!mod) return { now: 0, max: 1 };
      if (g.sec === 'all') return { now: modSectionsDone(g.ref), max: mod.sections.length };
      return { now: secDone(g.ref, g.sec) ? 1 : 0, max: 1 };
    }
    case 'vocab':
      return { now: Math.min(knownCount(g.ref), g.n), max: g.n };
    case 'drill':
      return { now: Math.min(S.drill[g.ref] || 0, g.n), max: g.n };
    case 'review':
      return { now: Math.min(S.stats.reviews, g.n), max: g.n };
    case 'exam': {
      const e = S.exams[g.ref];
      const pct = e ? Math.round((e.best / e.total) * 100) : 0;
      return { now: Math.min(pct, g.min), max: g.min, pct: true };
    }
    default:
      return { now: 0, max: 1 };
  }
}

function goalDone(g) {
  if (S.goals[g.id]) return true;
  const p = goalProgress(g);
  return p.now >= p.max;
}

function allGoals() {
  const out = [];
  PATH.forEach((ch) => ch.goals.forEach((g) => out.push({ ch, g })));
  return out;
}

/* Pierwszy niezamknięty cel — serce nawigacji „co teraz” */
function nextGoal() {
  for (const item of allGoals()) {
    if (!goalDone(item.g)) return item;
  }
  return null;
}

function goalUnlocked(goalId) {
  for (const item of allGoals()) {
    if (item.g.id === goalId) return true;
    if (!goalDone(item.g)) return false;
  }
  return false;
}

/* Domknięcie celów: przyznaje XP raz, przy pierwszym spełnieniu warunku */
function sweepGoals() {
  let gained = 0;
  const closed = [];
  for (const { g } of allGoals()) {
    if (S.goals[g.id]) continue;
    const p = goalProgress(g);
    if (p.now >= p.max) {
      S.goals[g.id] = Date.now();
      gained += g.xp;
      closed.push(g);
    }
  }
  if (gained) addXp(gained);
  return closed;
}

function pathProgress() {
  const all = allGoals();
  const done = all.filter(({ g }) => goalDone(g)).length;
  return { done, total: all.length, pct: Math.round((done / all.length) * 100) };
}

/* ------------------------------------------------------------
   Odznaki
   ------------------------------------------------------------ */

const BADGE_TESTS = {
  first:    () => Object.keys(S.goals).length >= 1,
  streak3:  () => S.bestStreak >= 3,
  streak7:  () => S.bestStreak >= 7,
  streak30: () => S.bestStreak >= 30,
  w100:     () => knownCount() >= 100,
  w300:     () => knownCount() >= 300,
  w600:     () => knownCount() >= 600,
  w1000:    () => knownCount() >= 1000,
  perfect:  () => !!S.flags_perfect,
  combo15:  () => S.stats.bestCombo >= 15,
  night:    () => !!S.flags_night,
  early:    () => !!S.flags_early,
  exam1:    () => { const e = S.exams.test; return !!e && e.best / e.total >= 0.7; },
  exam2:    () => { const e = S.exams.final; return !!e && e.best / e.total >= 0.8; },
  gram:     () => MODULES.every((m) => modComplete(m.id)),
  slangman: () => knownCount('slang') >= CATS.find((c) => c.id === 'slang').count,
  cheat:    () => REFS.every((r) => S.refs[r.id]),
  writer:   () => S.notes.length >= 10,
  typer:    () => S.stats.typed >= 50,
  path:     () => pathProgress().done === pathProgress().total,
  typist:   () => S.kb.bestCpm >= 80,
  blind:    () => KB_LESSONS.every((l) => S.kb.lessons[l.id]),
  builder:  () => S.sent.ok >= 50,
  reader:   () => S.reading.texts >= 10,
  rich:     () => S.coins >= 500,
  quester:  () => Object.keys(S.quests).length >= 15,
};

function sweepBadges() {
  const fresh = [];
  for (const b of BADGES) {
    if (S.badges[b.id]) continue;
    const test = BADGE_TESTS[b.id];
    if (test && test()) {
      S.badges[b.id] = Date.now();
      fresh.push(b);
    }
  }
  return fresh;
}

function markTimeFlags() {
  const h = new Date().getHours();
  if (h >= 0 && h < 5) S.flags_night = true;
  if (h >= 5 && h < 7) S.flags_early = true;
}

/* ------------------------------------------------------------
   Statystyki dnia — podstawa zadań pobocznych
   ------------------------------------------------------------ */

const EMPTY_DAY = { rev: 0, neu: 0, typed: 0, sent: 0, keys: 0, combo: 0, perfect: 0, gram: 0, read: 0, acc: 0 };

function dstat(day) {
  const k = day || today();
  if (!S.dstat[k]) S.dstat[k] = Object.assign({}, EMPTY_DAY);
  return S.dstat[k];
}

function bump(key, n) {
  const d = dstat();
  d[key] = (d[key] || 0) + (n == null ? 1 : n);
}

function raise(key, value) {
  const d = dstat();
  if (value > (d[key] || 0)) d[key] = value;
}

/* ------------------------------------------------------------
   Рубли — waluta za trafność
   ------------------------------------------------------------ */

function addCoins(n) {
  if (n <= 0) return 0;
  S.coins += n;
  return n;
}

function spendCoins(n) {
  if (S.coins < n) return false;
  S.coins -= n;
  return true;
}

/* Nagroda liczona tak, by opłacało się celować, a nie klikać */
function sessionReward(correct, total, bestCombo) {
  if (!total) return { coins: 0, parts: [] };
  const pct = Math.round((correct / total) * 100);
  const parts = [];
  let coins = correct;
  parts.push(['Trafione odpowiedzi', correct]);

  if (pct === 100 && total >= 8) { coins += 40; parts.push(['Sesja bez błędu', 40]); }
  else if (pct >= 90) { coins += 20; parts.push(['Trafność ponad 90%', 20]); }
  else if (pct >= 75) { coins += 8; parts.push(['Trafność ponad 75%', 8]); }

  const comboBonus = Math.floor(bestCombo / 5) * 4;
  if (comboBonus) { coins += comboBonus; parts.push(['Seria ×' + bestCombo, comboBonus]); }

  return { coins, parts, pct };
}

/* ------------------------------------------------------------
   Ekwipunek i ulepszenia
   ------------------------------------------------------------ */

function itemCount(id) { return S.inv[id] || 0; }
function hasPerk(id) { return !!S.perks[id]; }

function buy(id) {
  const item = SHOP.find((x) => x.id === id);
  if (!item) return { ok: false, why: 'Nie ma takiej pozycji' };
  if (item.kind === 'perk' && hasPerk(id)) return { ok: false, why: 'Masz już to na stałe' };
  if (item.kind === 'use' && itemCount(id) >= item.max) return { ok: false, why: 'Masz maksymalną liczbę' };
  if (!spendCoins(item.price)) return { ok: false, why: 'Za mało rubli' };
  if (item.kind === 'perk') S.perks[id] = Date.now();
  else S.inv[id] = itemCount(id) + 1;
  save();
  return { ok: true, item };
}

function useItem(id) {
  if (itemCount(id) <= 0) return false;
  S.inv[id] -= 1;
  save();
  return true;
}

/* ------------------------------------------------------------
   Zadania poboczne — trzy na dzień, losowane ziarnem z daty
   ------------------------------------------------------------ */

function seedFromDay(k) {
  let h = 2166136261;
  for (let i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function dailyQuests() {
  const k = today();
  const pool = QUEST_POOL.slice();
  let seed = seedFromDay(k);
  const out = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    out.push(pool.splice(seed % pool.length, 1)[0]);
  }
  return out;
}

function questProgress(q) {
  const d = dstat();
  const map = {
    answers: todayCount(),
    reviews: d.rev,
    newWords: d.neu,
    typed: d.typed,
    sentences: d.sent,
    combo: d.combo,
    keys: d.keys,
    reading: d.read,
    grammar: d.gram,
    accuracy: d.acc,
    perfect: d.perfect,
  };
  const now = map[q.type] || 0;
  return { now: Math.min(now, q.n), max: q.n, done: now >= q.n };
}

function questKey(q) { return today() + ':' + q.id; }

/* Wypłata następuje raz — przy pierwszym sprawdzeniu po spełnieniu warunku */
function sweepQuests() {
  const fresh = [];
  for (const q of dailyQuests()) {
    const key = questKey(q);
    if (S.quests[key]) continue;
    if (questProgress(q).done) {
      S.quests[key] = Date.now();
      addCoins(q.coin);
      addXp(q.xp);
      fresh.push(q);
    }
  }
  return fresh;
}

function questClaimed(q) { return !!S.quests[questKey(q)]; }

/* ------------------------------------------------------------
   Diagnoza — które tematy gubią najczęściej
   ------------------------------------------------------------ */

function noteTopic(cat, ok) {
  if (!cat) return;
  if (!S.topics[cat]) S.topics[cat] = { n: 0, bad: 0 };
  S.topics[cat].n++;
  if (!ok) S.topics[cat].bad++;
}

function weakTopics(min) {
  const floor = min == null ? 4 : min;
  return Object.keys(S.topics)
    .map((cat) => {
      const t = S.topics[cat];
      return { cat, n: t.n, bad: t.bad, rate: t.n ? t.bad / t.n : 0 };
    })
    .filter((t) => t.n >= floor && t.rate > 0.2)
    .sort((a, b) => b.rate - a.rate || b.bad - a.bad);
}

/* ------------------------------------------------------------
   Passa z uwzględnieniem zamrożenia
   ------------------------------------------------------------ */

function applyFreeze() {
  if (!S.lastDay || S.lastDay === today()) return false;
  const yesterday = dayKey(new Date(Date.now() - DAY));
  if (S.lastDay === yesterday) return false;
  if (itemCount('freeze') <= 0) return false;
  const twoAgo = dayKey(new Date(Date.now() - 2 * DAY));
  if (S.lastDay !== twoAgo) return false;
  useItem('freeze');
  S.lastDay = yesterday;
  return true;
}

/* ------------------------------------------------------------
   Domknięcie tury: cele, zadania, odznaki, zapis, powiadomienia
   ------------------------------------------------------------ */

function commit() {
  const goals = sweepGoals();
  const quests = sweepQuests();
  const badges = sweepBadges();
  save();
  goals.forEach((g) => UI.toast('Cel zamknięty', g.title + '  ·  +' + g.xp + ' XP'));
  quests.forEach((q) => UI.toast('Zadanie wykonane', q.pl + '  ·  +' + q.coin + ' ₽  +' + q.xp + ' XP'));
  badges.forEach((b) => UI.badgeToast(b));
  if (goals.length || badges.length || quests.length) UI.burst();
  return { goals, badges, quests };
}

function resetAll() {
  S = structuredClone(DEFAULTS);
  save();
}

window.Store = {
  get s() { return S; },
  save, commit, resetAll,
  today, dayKey, touchDay, streakAlive, todayCount, dailyDone,
  levelInfo, addXp, RANKS,
  card, known, grade, dueCards, dueCount, knownCount, seenCount, weakWords, KNOWN_BOX,
  logAnswer, markTimeFlags,
  modState, secDone, modSectionsDone, modComplete,
  goalProgress, goalDone, allGoals, nextGoal, goalUnlocked, pathProgress,
  dstat, bump, raise,
  addCoins, spendCoins, sessionReward, itemCount, hasPerk, buy, useItem,
  dailyQuests, questProgress, questClaimed, sweepQuests,
  noteTopic, weakTopics, applyFreeze,
};
})();

</script>
<script>/* js\speech.js */
(function () {
/* ============================================================
   MOWA — trzy poziomy, zawsze coś słychać

   1. Głos rosyjski, jeśli jest w systemie — czyta cyrylicę wprost.
   2. Brak rosyjskiego, jest polski — czyta transkrypcję fonetyczną.
      Polska fonetyka leży blisko rosyjskiej, więc „spasiba" wypowiedziane
      polskim głosem brzmi niemal jak спасибо. To nie proteza na siłę,
      tylko ta sama zasada, na której stoi cały kurs.
   3. Brak obu — cisza i uczciwy komunikat zamiast udawania.
   ============================================================ */

let voices = [];
let ruVoice = null;
let plVoice = null;
let chosenUri = null;
let primed = false;

const has = 'speechSynthesis' in window;

function refresh() {
  if (!has) return;
  const v = window.speechSynthesis.getVoices();
  if (!v || !v.length) return;
  voices = v;

  const pref = chosenUri && v.find((x) => x.voiceURI === chosenUri);
  ruVoice = pref && /^ru/i.test(pref.lang) ? pref
    : v.find((x) => x.lang === 'ru-RU') || v.find((x) => /^ru/i.test(x.lang)) || null;
  plVoice = pref && /^pl/i.test(pref.lang) ? pref
    : v.find((x) => x.lang === 'pl-PL') || v.find((x) => /^pl/i.test(x.lang)) || null;
}

if (has) {
  refresh();
  window.speechSynthesis.addEventListener('voiceschanged', refresh);
}

function mode() {
  if (!has) return 'none';
  if (ruVoice) return 'native';
  if (plVoice) return 'polish';
  return 'none';
}

function status() {
  const m = mode();
  return {
    mode: m,
    supported: has,
    voiceName: m === 'native' ? ruVoice.name : m === 'polish' ? plVoice.name : null,
    count: voices.length,
    russian: voices.filter((v) => /^ru/i.test(v.lang)).map((v) => v.name),
    all: voices.map((v) => ({ uri: v.voiceURI, name: v.name, lang: v.lang })),
  };
}

/* ------------------------------------------------------------
   Cyrylica → zapis, który polski syntezator przeczyta sensownie
   ------------------------------------------------------------ */

const SOFT_PAIRS = { 'е': 'ie', 'ё': 'io', 'ю': 'iu', 'я': 'ia' };
const IOT_PAIRS  = { 'е': 'je', 'ё': 'jo', 'ю': 'ju', 'я': 'ja' };
const VOWELS = 'аеёиоуыэюя';

const MAP = {
  'а': 'a', 'б': 'b', 'в': 'w', 'г': 'g', 'д': 'd', 'ж': 'ż', 'з': 'z',
  'и': 'i', 'й': 'j', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o',
  'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u', 'ф': 'f', 'х': 'ch',
  'ц': 'c', 'ч': 'cz', 'ш': 'sz', 'щ': 'szcz', 'ы': 'y', 'э': 'e',
  'ъ': '', 'ь': '',
};

/* Przybliżenie — bez znajomości akcentu nie da się oddać akania,
   więc „о" zostaje „o". Krzywdy nie robi, a nie zmyśla. */
function ruToPl(text) {
  const s = String(text).toLowerCase();
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    const prev = s[i - 1] || '';
    if (SOFT_PAIRS[ch]) {
      const iot = !prev || VOWELS.includes(prev) || prev === 'ъ' || prev === 'ь' || !/[а-я]/.test(prev);
      out += iot ? IOT_PAIRS[ch] : SOFT_PAIRS[ch];
      continue;
    }
    out += MAP[ch] != null ? MAP[ch] : ch;
  }
  return out;
}

/* Transkrypcja z bazy ma myślniki i WIELKIE litery na akcencie —
   czytelne dla oka, ale syntezator ma to wymówić, nie przeliterować. */
function trToSpeech(tr) {
  return String(tr)
    .replace(/[-–—]/g, '')
    .replace(/\s+/g, ' ')
    .toLowerCase()
    .trim();
}

/* ------------------------------------------------------------
   Wypowiadanie
   ------------------------------------------------------------ */

function prime() {
  if (primed || !has) return;
  primed = true;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch (e) { /* część przeglądarek nie potrzebuje rozgrzewki */ }
}
['pointerdown', 'keydown'].forEach((ev) =>
  window.addEventListener(ev, prime, { once: true, capture: true }));

let lastCall = 0;

/*
  input: string z cyrylicą albo obiekt słowa { ru, tr }
*/
function speak(input, btn) {
  if (!Store.s.settings.tts || !has) return false;

  const word = typeof input === 'string' ? { ru: input, tr: null } : (input || {});
  const m = mode();
  if (m === 'none') return false;

  let text, lang, voice;
  if (m === 'native') {
    text = word.ru;
    lang = 'ru-RU';
    voice = ruVoice;
  } else {
    text = word.tr ? trToSpeech(word.tr) : ruToPl(word.ru);
    lang = 'pl-PL';
    voice = plVoice;
  }
  if (!text) return false;

  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.voice = voice;
    u.rate = m === 'native' ? 0.9 : 0.84;
    u.pitch = 1;

    /* Chrome potrafi zgubić wypowiedź zleconą w tej samej klatce co cancel() */
    const now = Date.now();
    const wait = now - lastCall < 120 ? 90 : 30;
    lastCall = now;
    setTimeout(() => { try { window.speechSynthesis.speak(u); } catch (e) {} }, wait);

    if (btn) {
      btn.classList.add('ringing');
      setTimeout(() => btn.classList.remove('ringing'), 700);
    }
    return true;
  } catch (e) {
    return false;
  }
}

function setVoice(uri) {
  chosenUri = uri || null;
  Store.s.settings.voice = chosenUri;
  refresh();
  Store.save();
}

function init() {
  chosenUri = Store.s.settings.voice || null;
  refresh();
}

window.Speech = { init, speak, status, setVoice, ruToPl, trToSpeech, refresh, mode };
})();

</script>
<script>/* js\app.js */
(function () {
/* ============================================================
   РУССКИЙ ПУТЬ — router, widoki, silnik sesji
   ============================================================ */

const $ = (s, r) => (r || document).querySelector(s);
const ST = () => Store.s;
const { h, esc, shuffle, pick, fmtTime, bar, ring, countUp } = UI;
const CYR = /[а-яА-ЯёЁ]/;

/* Most dla pozostałych plików z widokami — rejestrują tu swoje ekrany
   i tryby sesji, zamiast puchnąć razem z tym plikiem. */
const App = window.App = {
  VIEWS: {},
  KINDS: {},
  get view() { return view; },
  get session() { return session; },
  resetView: (c) => resetView(c),
  render: () => render(),
  go: (r) => go(r),
  newSession: (cfg) => newSession(cfg),
  advance: (d) => advance(d),
  scoreAnswer: (ok, id) => scoreAnswer(ok, id),
  sessTop: () => sessTop(),
  tile: (a, b, c, d) => tile(a, b, c, d),
  wireCommon: () => wireCommon(),
  choiceItem: (w, dir) => choiceItem(w, dir),
  itemForWord: (w) => itemForWord(w),
  CYR,
};

let view = null;      // kontener treści
let route = '';       // aktualna trasa
let session = null;   // aktywna sesja nauki

/* ============================================================
   NAWIGACJA
   ============================================================ */

const NAV = [
  { r: 'home',   ico: 'П', label: 'Pulpit' },
  { r: 'path',   ico: '↗', label: 'Ścieżka' },
  { r: 'quests', ico: '✦', label: 'Zadania' },
  { r: 'train',  ico: 'Т', label: 'Trening' },
  { r: 'dict',   ico: '≡', label: 'Słownik' },
  { r: 'shop',   ico: '₽', label: 'Sklep' },
  { r: 'notes',  ico: 'З', label: 'Notatki' },
  { r: 'stats',  ico: '▦', label: 'Postępy' },
];

/* Trasy, które nie mają własnej pozycji w menu, ale podświetlają rodzica */
const NAV_PARENT = {
  vocab: 'train', grammar: 'train', refs: 'train',
  keyboard: 'train', sentences: 'train', reading: 'train',
};

function go(r) {
  location.hash = '#/' + r;
}

function currentRoute() {
  return (location.hash || '#/home').replace(/^#\//, '');
}

window.addEventListener('hashchange', () => {
  const next = currentRoute();
  if (session && !next.startsWith('session')) { stopClock(); session = null; }
  render();
});

/* ============================================================
   SZKIELET
   ============================================================ */

function buildShell() {
  document.body.innerHTML = '';
  const app = h('<div id="app"></div>');

  const rail = h(
    '<aside class="rail">' +
      '<div class="brand">' +
        '<div class="brand-mark">РУС<span>СКИЙ</span></div>' +
        '<div class="brand-sub">путь · ścieżka</div>' +
      '</div>' +
      '<nav class="nav" id="nav"></nav>' +
      '<div class="rail-foot" id="railfoot"></div>' +
    '</aside>'
  );

  const main = h(
    '<div class="main">' +
      '<header class="hud" id="hud"></header>' +
      '<main class="view" id="view"></main>' +
    '</div>'
  );

  app.appendChild(rail);
  app.appendChild(main);
  document.body.appendChild(app);
  view = $('#view');

  $('#nav').addEventListener('click', (e) => {
    const b = e.target.closest('[data-r]');
    if (b) go(b.dataset.r);
  });
}

function paintNav() {
  const due = Store.dueCount();
  const base = route.split('/')[0];
  const active = NAV_PARENT[base] || base;
  const questsLeft = Store.dailyQuests().filter((q) => !Store.questClaimed(q)).length;

  $('#nav').innerHTML = NAV.map((n) => {
    const on = active === n.r;
    const count = n.r === 'train' ? due : n.r === 'quests' ? questsLeft : 0;
    const badge = count ? '<span class="nav-badge">' + count + '</span>' : '';
    return (
      '<button class="nav-item' + (on ? ' on' : '') + '" data-r="' + n.r + '">' +
        '<span class="ico">' + n.ico + '</span>' +
        '<span>' + n.label + '</span>' + badge +
      '</button>'
    );
  }).join('');

  const p = Store.pathProgress();
  $('#railfoot').innerHTML = 'ścieżka ' + p.done + '/' + p.total + ' · ' + p.pct + '%';
}

function paintHud() {
  const s = ST();
  const lv = Store.levelInfo(s.xp);
  const alive = Store.streakAlive();
  const dc = Store.todayCount();
  const goalPct = Math.min(100, Math.round((dc / s.dailyGoal) * 100));

  $('#hud').innerHTML =
    '<div class="hud-stat" title="Passa dni nauki">' +
      '<span class="k' + (alive && s.streak > 0 ? ' redc' : '') + '">' +
        '<span class="flame' + (alive && s.streak > 0 ? ' live' : '') + '">▲</span> ' + s.streak + '</span>' +
      '<span class="l">passa</span>' +
    '</div>' +
    '<div class="hud-stat" title="Słówka w pamięci długotrwałej">' +
      '<span class="k">' + Store.knownCount() + '</span>' +
      '<span class="l">słów</span>' +
    '</div>' +
    '<div class="hud-xp">' +
      '<div class="hud-xp-top"><span>' + lv.rank + ' · poz. ' + lv.lvl + '</span>' +
      '<span>' + lv.rest + '/' + lv.need + '</span></div>' +
      bar(lv.pct) +
    '</div>' +
    '<div style="margin-left:auto;display:flex;align-items:center;gap:10px">' +
      '<div class="hud-stat" style="text-align:right"><span class="k">' + dc + '<span class="dim" style="font-size:14px">/' + s.dailyGoal + '</span></span>' +
      '<span class="l">dziś</span></div>' +
      ring(goalPct, goalPct >= 100 ? '✓' : goalPct + '%', goalPct >= 100) +
    '</div>';
}

/* ============================================================
   RENDER
   ============================================================ */

/* Widoki podpinają własne listenery do kontenera. Gdybyśmy tylko czyścili
   jego wnętrze, listenery narastałyby z każdym renderem i jedno kliknięcie
   odpalałoby akcję wielokrotnie — dlatego wymieniamy cały węzeł. */
function resetView(cls) {
  const fresh = document.createElement('main');
  fresh.id = 'view';
  fresh.className = cls || 'view';
  view.replaceWith(fresh);
  view = fresh;
  return fresh;
}

function render() {
  route = currentRoute();
  paintNav();
  paintHud();

  if (session) { renderSession(); return; }

  const [base, arg] = route.split('/');
  const map = Object.assign({
    home: viewHome, path: viewPath, vocab: viewVocab, grammar: viewGrammar,
    refs: viewRefs, dict: viewDict, notes: viewNotes, stats: viewStats,
    train: viewTrain,
  }, App.VIEWS);
  const fn = map[base] || viewHome;
  resetView('view enter');
  fn(arg);
  window.scrollTo({ top: 0, behavior: UI.reduced ? 'auto' : 'smooth' });
}

/* ============================================================
   PULPIT
   ============================================================ */

function goalActionLabel(g) {
  return { ref: 'Otwórz ściągawkę', module: 'Ćwicz', vocab: 'Ucz się', drill: 'Trenuj', exam: 'Podejdź', review: 'Powtarzaj' }[g.type] || 'Zaczynaj';
}

function viewHome() {
  const s = ST();
  const next = Store.nextGoal();
  const due = Store.dueCount();
  const lv = Store.levelInfo(s.xp);
  const pp = Store.pathProgress();

  const glyph = next ? (next.ch.ru[0] || 'Р') : '✓';

  let now;
  if (next) {
    const p = Store.goalProgress(next.g);
    now =
      '<div class="now" data-glyph="' + esc(glyph) + '">' +
        '<div class="now-in">' +
          '<span class="eyebrow">Rozdział ' + next.ch.num + ' · ' + esc(next.ch.pl) + '</span>' +
          '<h2>' + esc(next.g.title) + '</h2>' +
          '<p>' + esc(next.g.desc) + '</p>' +
          '<div class="now-meta">' +
            '<div><span class="k">' + p.now + '<span class="dim">/' + p.max + (p.pct ? '%' : '') + '</span></span><span class="l">postęp celu</span></div>' +
            '<div><span class="k gold">+' + next.g.xp + '</span><span class="l">XP za cel</span></div>' +
            '<div><span class="k">' + pp.done + '<span class="dim">/' + pp.total + '</span></span><span class="l">cele ścieżki</span></div>' +
          '</div>' +
          '<div class="now-actions">' +
            '<button class="btn primary" data-act="start-goal">' + goalActionLabel(next.g) + ' →</button>' +
            (due ? '<button class="btn" data-act="review">Powtórki (' + due + ')</button>' : '') +
            '<button class="btn ghost" data-act="goto-path">Cała ścieżka</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  } else {
    now =
      '<div class="now" data-glyph="✵">' +
        '<div class="now-in">' +
          '<span class="eyebrow">Ścieżka przebyta</span>' +
          '<h2>Zostały już tylko słówka</h2>' +
          '<p>Wszystkie cele zamknięte. Teraz liczy się codzienna powtórka i dokładanie nowych słów — dokładnie tak, jak miało być.</p>' +
          '<div class="now-actions">' +
            '<button class="btn primary" data-act="review">Powtórki (' + due + ')</button>' +
            '<button class="btn" data-act="weak">Trenuj słabe punkty</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  const tiles =
    '<div class="tiles stagger">' +
      tile(Store.knownCount(), 'w pamięci', 'z ' + WORDS.length + ' słów', 'var(--gold)') +
      tile(due, 'do powtórki', due ? 'kolejka czeka' : 'kolejka pusta', due ? 'var(--red)' : 'var(--green)') +
      tile(s.streak, 'dni z rzędu', 'rekord: ' + s.bestStreak, 'var(--red)') +
      tile(lv.lvl, 'poziom', lv.rank, 'var(--violet)') +
      tile(accuracy() + '%', 'skuteczność', s.stats.answered + ' odpowiedzi', 'var(--green)') +
      tile(Object.keys(s.badges).length, 'odznaki', 'z ' + BADGES.length, 'var(--blue)') +
    '</div>';

  const wordOfDay = dailyWord();
  const woD =
    '<div class="card" style="position:relative;overflow:hidden">' +
      '<span class="eyebrow">Słowo dnia</span>' +
      '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:8px">' +
        '<span class="cyr" style="font-size:40px">' + esc(wordOfDay.ru) + '</span>' +
        '<span style="font-size:18px">' + esc(wordOfDay.pl) + '</span>' +
        '<span class="mono dim" style="font-size:13px">' + esc(wordOfDay.tr) + '</span>' +
        '<button class="btn sm ghost" data-speak="' + esc(wordOfDay.ru) + '" data-tr="' + esc(wordOfDay.tr) + '" style="margin-left:auto">♪ Posłuchaj</button>' +
      '</div>' +
      (wordOfDay.ex ? '<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px">' +
        esc(wordOfDay.ex) + '<div class="dim" style="font-size:13px">' + esc(wordOfDay.exPl || '') + '</div></div>' : '') +
    '</div>';

  const quick =
    '<div class="grid g3 stagger" style="margin-top:14px">' +
      quickCard('Szybka runda', '10 pytań z tego, co już widziałeś', 'quick') +
      quickCard('Słabe punkty', 'Słowa, które najczęściej wracają', 'weak') +
      quickCard('Dopasuj pary', 'Pięć par na czas — rozgrzewka', 'match') +
      quickCard('Wpisz z pamięci', 'Klawiatura cyrylicy, bez podpowiedzi', 'typing') +
    '</div>';

  view.innerHTML =
    '<div class="view-head">' +
      '<span class="eyebrow">' + greeting() + '</span>' +
      '<h1>Pulpit</h1>' +
    '</div>' +
    now + tiles +
    '<div class="group-head"><h3>Dziś</h3><span class="d">jedno słowo, cztery skróty</span></div>' +
    woD + quick;

  wireCommon();
}

function tile(k, l, s, accent) {
  return '<div class="tile" style="--accent:' + accent + '"><div class="k">' + esc(k) + '</div>' +
    '<div class="l">' + esc(l) + '</div><div class="s">' + esc(s) + '</div></div>';
}

function quickCard(title, desc, act) {
  return '<button class="cat" data-act="' + act + '">' +
    '<div class="cat-name" style="margin-bottom:6px">' + esc(title) + '</div>' +
    '<div style="font-size:12.5px;color:var(--muted)">' + esc(desc) + '</div>' +
    '<div style="margin-top:12px" class="eyebrow gold">Start →</div>' +
    '</button>';
}

function greeting() {
  const hh = new Date().getHours();
  if (hh < 5) return 'Доброй ночи · późno już';
  if (hh < 11) return 'Доброе утро · dzień dobry';
  if (hh < 18) return 'Добрый день · dzień dobry';
  return 'Добрый вечер · dobry wieczór';
}

function accuracy() {
  const st = ST().stats;
  return st.answered ? Math.round((st.correct / st.answered) * 100) : 0;
}

function dailyWord() {
  const d = new Date();
  const seed = d.getFullYear() * 1000 + d.getMonth() * 40 + d.getDate();
  return WORDS[seed % WORDS.length];
}

/* ============================================================
   ŚCIEŻKA
   ============================================================ */

function viewPath() {
  const pp = Store.pathProgress();
  let html =
    '<div class="view-head">' +
      '<span class="eyebrow">Od zera do swobody · ' + pp.done + ' z ' + pp.total + ' celów</span>' +
      '<h1>Ścieżka</h1>' +
      '<p>Cele odblokowują się po kolei. Nie musisz decydować, co dalej — wystarczy schodzić w dół.</p>' +
      '<div style="max-width:420px;margin-top:16px">' + bar(pp.pct) + '</div>' +
    '</div>';

  let reachedOpen = false;

  html += PATH.map((ch) => {
    const done = ch.goals.filter((g) => Store.goalDone(g)).length;
    const goals = ch.goals.map((g) => {
      const isDone = Store.goalDone(g);
      const p = Store.goalProgress(g);
      const isActive = !isDone && !reachedOpen;
      if (!isDone && !reachedOpen) reachedOpen = true;
      const locked = !isDone && !isActive;
      const cls = isDone ? 'done' : isActive ? 'active' : 'locked';
      const mark = isDone ? '✓' : locked ? '·' : '→';
      const pct = Math.round((p.now / p.max) * 100);
      return (
        '<button class="goal ' + cls + '"' + (locked ? ' disabled' : '') +
          ' data-goal="' + g.id + '">' +
          '<span class="goal-mark">' + mark + '</span>' +
          '<span class="goal-body">' +
            '<span class="goal-title">' + esc(g.title) + '</span>' +
            '<span class="goal-desc">' + esc(g.desc) + '</span>' +
          '</span>' +
          '<span class="goal-side">' +
            '<span class="goal-prog">' + bar(pct, isDone ? 'green' : '') + '</span>' +
            '<span class="goal-xp">' + (isDone ? '✓ ' : '+') + g.xp + '</span>' +
          '</span>' +
        '</button>'
      );
    }).join('');

    return (
      '<section class="chapter">' +
        '<div class="chapter-head">' +
          '<div class="chapter-num">' + ch.num + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="ru cyr">' + esc(ch.ru) + '</div>' +
            '<h2>' + esc(ch.pl) + '</h2>' +
            '<p>' + esc(ch.desc) + '</p>' +
          '</div>' +
          '<div class="chapter-prog"><div class="k">' + done + '<span class="dim">/' + ch.goals.length + '</span></div>' +
          '<div class="l">celów</div></div>' +
        '</div>' +
        '<div class="goals stagger">' + goals + '</div>' +
      '</section>'
    );
  }).join('');

  view.innerHTML = html;

  view.addEventListener('click', (e) => {
    const b = e.target.closest('[data-goal]');
    if (!b || b.disabled) return;
    const found = Store.allGoals().find(({ g }) => g.id === b.dataset.goal);
    if (found) startGoal(found.g);
  });
}

/* Uruchomienie celu — każdy typ trafia tam, gdzie trzeba */
function startGoal(g) {
  switch (g.type) {
    case 'ref':
      ST().refs[g.ref] = Date.now();
      Store.commit();
      go('refs');
      setTimeout(() => {
        const d = document.getElementById('ref-' + g.ref);
        if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      }, 90);
      break;
    case 'module': {
      const mod = MODULES.find((m) => m.id === g.ref);
      if (!mod) return;
      let idx = g.sec;
      if (idx === 'all') {
        idx = mod.sections.findIndex((_, i) => !Store.secDone(mod.id, i));
        if (idx < 0) idx = 0;
      }
      startQuiz(mod, idx);
      break;
    }
    case 'vocab':
      startVocabSession(g.ref);
      break;
    case 'drill':
      startDrill(g.ref);
      break;
    case 'exam':
      startExam(g.ref);
      break;
    case 'review':
      startReview();
      break;
  }
}

/* ============================================================
   SŁOWNICTWO
   ============================================================ */

/* ============================================================

function catCard(c) {
  const kn = Store.knownCount(c.id);
  const pct = Math.round((kn / c.count) * 100);
  return (
    '<button class="cat" data-cat="' + c.id + '">' +
      '<span class="cat-glyph cyr">' + esc(c.glyph) + '</span>' +
      '<div class="cat-ru cyr">' + esc(c.ru) + '</div>' +
      '<div class="cat-name">' + esc(c.name) + '</div>' +
      '<div class="cat-stat"><span>' + kn + ' / ' + c.count + '</span><span>' + pct + '%</span></div>' +
      bar(pct, pct === 100 ? 'green' : '') +
    '</button>'
  );
}

function viewCategory(catId) {
  const c = CATS.find((x) => x.id === catId);
  if (!c) { go('vocab'); return; }
  const words = WORDS.filter((w) => w.cat === catId);
  const kn = Store.knownCount(catId);
  const seen = Store.seenCount(catId);
  const pct = Math.round((kn / c.count) * 100);

  view.innerHTML =
    '<div class="view-head">' +
      '<button class="btn sm ghost" data-act="back-vocab" style="margin-bottom:14px">← Wszystkie kategorie</button>' +

      '<h1>' + esc(c.name) + '</h1>' +
      '<div class="tiles" style="margin-top:18px">' +
        tile(c.count, 'słów w temacie', '', 'var(--bone)') +
        tile(kn, 'w pamięci', pct + '% tematu', 'var(--gold)') +
        tile(seen - kn < 0 ? 0 : seen - kn, 'w trakcie', 'jeszcze się utrwalają', 'var(--red)') +
        tile(c.count - seen, 'nietkniętych', '', 'var(--muted)') +
      '</div>' +

    words.map((w) => {

function viewGrammar() {
  const mods = MODULES.map((m) => {
    const done = Store.modSectionsDone(m.id);
    const pct = Math.round((done / m.sections.length) * 100);
    const qn = m.sections.reduce((a, s) => a + s.questions.length, 0);
    return (
      '<button class="cat" data-mod="' + m.id + '">' +
        '<span class="cat-glyph cyr">' + esc(m.sections[0] && m.sections[0].icon ? m.sections[0].icon : 'Г') + '</span>' +
        '<div class="cat-ru">' + m.sections.length + ' sekcji · ' + qn + ' pytań</div>' +
        '<div class="cat-name">' + esc(m.title) + '</div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;min-height:34px">' + esc(m.desc) + '</div>' +
        '<div class="cat-stat"><span>' + done + ' / ' + m.sections.length + ' sekcji</span><span>' + pct + '%</span></div>' +
        bar(pct, pct === 100 ? 'green' : '') +
      '</button>'
    );
  }).join('');

  const exams = EXAMS.map((e) => {
    const r = ST().exams[e.id];
    const pct = r ? Math.round((r.best / r.total) * 100) : 0;
    return (
      '<button class="cat" data-exam="' + e.id + '">' +
        '<span class="cat-glyph cyr">' + (e.id === 'final' ? 'Э' : 'З') + '</span>' +
        '<div class="cat-ru">' + e.questions.length + ' pytań · na czas</div>' +
        '<div class="cat-name">' + esc(e.title) + '</div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;min-height:34px">' + esc(e.desc) + '</div>' +
        '<div class="cat-stat"><span>' + (r ? 'Rekord: ' + r.best + '/' + r.total : 'Jeszcze nie podchodziłeś') + '</span><span>' + (r ? pct + '%' : '') + '</span></div>' +
        bar(pct, pct >= 80 ? 'green' : '') +
      '</button>'
    );
  }).join('');

  view.innerHTML =
    '<div class="view-head">' +
      '<span class="eyebrow">9 modułów · 475 pytań · 2 egzaminy</span>' +
      '<h1>Gramatyka</h1>' +
      '<p>Materiał, który już przerobiłeś — tu jest w całości, sekcja po sekcji, żeby było do czego wracać.</p>' +
    '</div>' +
    '<div class="group-head"><h3>Moduły</h3><span class="d">sekcja po sekcji</span></div>' +
    '<div class="grid g3 stagger">' + mods + '</div>' +
    '<div class="group-head"><h3>Sprawdź się</h3><span class="d">z timerem i oceną</span></div>' +
    '<div class="grid g2 stagger">' + exams + '</div>';

  view.addEventListener('click', (e) => {
    const m = e.target.closest('[data-mod]');
    if (m) return openModule(m.dataset.mod);
    const x = e.target.closest('[data-exam]');
    if (x) return startExam(x.dataset.exam);
  });
}

function openModule(id) {
  const mod = MODULES.find((m) => m.id === id);
  if (!mod) return;

  const secs = mod.sections.map((sec, i) => {
    const best = (ST().mod[id] && ST().mod[id].sec) ? ST().mod[id].sec[i] : null;
    const done = best != null;
    return (
      '<button class="goal ' + (done ? 'done' : 'active') + '" data-sec="' + i + '">' +
        '<span class="goal-mark cyr">' + esc(sec.icon || (i + 1)) + '</span>' +
        '<span class="goal-body">' +
          '<span class="goal-title">' + esc(sec.title) + '</span>' +
          '<span class="goal-desc">' + sec.questions.length + ' pytań' +
          (done ? ' · najlepszy wynik ' + best + '/' + sec.questions.length : '') + '</span>' +
        '</span>' +
        '<span class="goal-side"><span class="goal-xp">' + (done ? '✓' : '→') + '</span></span>' +
      '</button>'
    );
  }).join('');

  resetView('view enter');
  view.innerHTML =
    '<div class="view-head">' +
      '<button class="btn sm ghost" data-act="back-grammar" style="margin-bottom:14px">← Gramatyka</button>' +
      '<h1>' + esc(mod.title) + '</h1>' +
      '<p>' + esc(mod.desc) + '</p>' +
      '<div class="now-actions">' +
        '<button class="btn primary" data-act="drill-mod" data-mod="' + id + '">Losowy trening (20 pytań)</button>' +
      '</div>' +
    '</div>' +
    '<div class="goals stagger">' + secs + '</div>';

  view.addEventListener('click', (e) => {
    const b = e.target.closest('[data-sec]');
    if (b) startQuiz(mod, +b.dataset.sec);
  });
  wireCommon();
}

function refBlock(b) {

  }
  if (b.t === 'pairs') {
    return '<div class="ref-block"><h4>' + esc(b.title) + '</h4><div class="pairs">' +
      b.items.map((i) =>
        '<div class="pair"><span class="a cyr">' + esc(i[0]) + '</span>' +

        '<span class="c">' + esc(i[2] || '') + '</span></div>').join('') +

      '<thead><tr>' + b.head.map((x) => '<th>' + esc(x) + '</th>').join('') + '</tr></thead>' +
      '<tbody>' + b.rows.map((r) =>
        '<tr>' + r.map((c, i) => '<td' + (i > 0 ? ' class="cyr" style="font-size:16px"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div></div>';
  }
  return '';
}

let dictQuery = '', dictCat = '', dictFilter = '';

function viewDict() {
  view.innerHTML =
    '<div class="view-head">' +
      '<span class="eyebrow">' + WORDS.length + ' haseł</span>' +
      '<h1>Słownik</h1>' +
    '</div>' +
    '<div class="tools">' +
      '<input class="search" id="dq" placeholder="Szukaj po rosyjsku, polsku lub w transkrypcji…" value="' + esc(dictQuery) + '">' +
      '<select class="sel" id="dc"><option value="">Wszystkie kategorie</option>' +
        CATS.map((c) => '<option value="' + c.id + '"' + (dictCat === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') +
      '</select>' +
      '<select class="sel" id="df">' +
        '<option value="">Cały stan</option>' +
        '<option value="new"' + (dictFilter === 'new' ? ' selected' : '') + '>Nietknięte</option>' +
        '<option value="learning"' + (dictFilter === 'learning' ? ' selected' : '') + '>W trakcie</option>' +
        '<option value="known"' + (dictFilter === 'known' ? ' selected' : '') + '>W pamięci</option>' +
        '<option value="weak"' + (dictFilter === 'weak' ? ' selected' : '') + '>Sprawiają kłopot</option>' +
      '</select>' +
    '</div>' +
    '<div id="dres"></div>';

  const run = () => {
    const q = dictQuery.trim().toLowerCase();
    let list = WORDS.filter((w) => {
      if (dictCat && w.cat !== dictCat) return false;
      const c = ST().srs[w.id];
      if (dictFilter === 'new' && c && c.s > 0) return false;
      if (dictFilter === 'learning' && !(c && c.s > 0 && c.b < Store.KNOWN_BOX)) return false;
      if (dictFilter === 'known' && !Store.known(w.id)) return false;
      if (dictFilter === 'weak' && !(c && c.w > 0)) return false;
      if (!q) return true;
      return w.ru.toLowerCase().includes(q) || w.pl.toLowerCase().includes(q) || w.tr.toLowerCase().includes(q);
    });
    const shown = list.slice(0, 400);
    $('#dres').innerHTML = list.length
      ? '<div class="dim" style="margin-bottom:10px;font-size:13px">' + list.length + ' ' +
        UI.plural(list.length, 'wynik', 'wyniki', 'wyników') +
        (list.length > 400 ? ' · pokazuję pierwsze 400' : '') + '</div>' +
        '<div class="tablewrap">' + wordTable(shown) + '</div>'
      : '<div class="empty"><div class="g cyr">Ø</div>Nic nie pasuje do tych kryteriów.</div>';
  };
  run();

  $('#dq').addEventListener('input', (e) => { dictQuery = e.target.value; run(); });
  $('#dc').addEventListener('change', (e) => { dictCat = e.target.value; run(); });
  $('#df').addEventListener('change', (e) => { dictFilter = e.target.value; run(); });
  wireCommon();
}

function viewNotes() {
  const notes = ST().notes;
  view.innerHTML =
    '<div class="view-head">' +
      '<span class="eyebrow">' + notes.length + ' ' + UI.plural(notes.length, 'notatka', 'notatki', 'notatek') + '</span>' +
      '<h1>Notatki</h1>' +
      '<p>Własne obserwacje, wyjątki, zdania zasłyszane w serialu. Wszystko zostaje na tym urządzeniu.</p>' +
    '</div>' +
    '<div class="editor">' +
      '<input id="nt" placeholder="Tytuł notatki" maxlength="90">' +
      '<textarea id="nb" rows="4" placeholder="Treść — zasada, przykład, cokolwiek chcesz zapamiętać"></textarea>' +
      '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">' +
        '<button class="btn primary" data-act="note-add">Zapisz notatkę</button>' +
        '<span class="dim" style="font-size:12px">Ctrl + Enter też działa</span>' +
      '</div>' +
    '</div>' +
    (notes.length
      ? '<div class="grid g2 stagger">' + notes.map(noteCard).join('') + '</div>'
      : '<div class="empty"><div class="g cyr">✎</div>Jeszcze nic tu nie ma. Pierwsza notatka to dobry moment,<br>żeby zapisać coś, co dziś Cię zaskoczyło.</div>');

  const add = () => {
    const t = $('#nt').value.trim(), b = $('#nb').value.trim();
    if (!t && !b) return;
    ST().notes.unshift({ id: 'n' + Date.now(), t: t || 'Bez tytułu', b, ts: Date.now() });
    Store.commit();
    UI.toast('Zapisano', 'Notatka trafiła do zbioru');
    render();
  };
  $('#nb').addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'Enter') add(); });
  view.addEventListener('click', (e) => {
    if (e.target.closest('[data-act="note-add"]')) return add();
    const d = e.target.closest('[data-del]');
    if (d) {
      ST().notes = ST().notes.filter((n) => n.id !== d.dataset.del);
      Store.commit();
      render();
    }
  });
}
