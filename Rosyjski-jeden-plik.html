/* Diagnostyka mowy — mówi wprost, co gra i czego brakuje */
function speechPanel() {
  const st = window.Speech ? Speech.status() : { mode: 'none', supported: false, all: [] };

  let banner;
  if (!st.supported) {
    banner =
      '<div class="verdict no"><div class="verdict-head">Brak syntezatora</div>' +
      '<p>Ta przeglądarka nie udostępnia syntezy mowy. Transkrypcja fonetyczna przy każdym słowie działa bez zmian.</p></div>';
  } else if (st.mode === 'native') {
    banner =
      '<div class="verdict ok"><div class="verdict-head">Głos rosyjski działa</div>' +
      '<p>Cyrylicę czyta <b>' + esc(st.voiceName) + '</b> — bezpośrednio, bez pośrednictwa transkrypcji.</p></div>';
  } else if (st.mode === 'polish') {
    banner =
      '<div class="verdict"><div class="verdict-head gold">Czytam przez transkrypcję</div>' +
      '<p>W tym systemie nie ma rosyjskiego głosu, więc rosyjskie słowa czyta polski głos ' +
      '<b>' + esc(st.voiceName) + '</b> z zapisu fonetycznego: <span class="mono">спасибо → spasiba</span>. ' +
      'Brzmi blisko oryginału, bo polska fonetyka leży niedaleko rosyjskiej.</p>' +
      '<div class="hint">Chcesz prawdziwy rosyjski głos? Ustawienia Windows → Czas i język → Język i region → ' +
      'Dodaj język → Rosyjski, i przy instalacji zaznacz „Zamiana tekstu na mowę”. Potem zrestartuj przeglądarkę.</div></div>';
  } else {
    banner =
      '<div class="verdict no"><div class="verdict-head">Żaden głos nie jest dostępny</div>' +
      '<p>System nie zgłasza ani rosyjskiego, ani polskiego głosu. Zostaje transkrypcja fonetyczna na ekranie.</p></div>';
  }

  const picker = st.all && st.all.length
    ? '<div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">' +
        '<select class="sel" id="voicepick">' +
          '<option value="">Wybór automatyczny</option>' +
          st.all.map((v) => '<option value="' + esc(v.uri) + '"' +
            (ST().settings.voice === v.uri ? ' selected' : '') + '>' +
            esc(v.name) + ' (' + esc(v.lang) + ')</option>').join('') +
        '</select>' +
        '<button class="btn sm primary" data-act="tts-test">Posłuchaj próbki</button>' +
      '</div>'
    : '';

  return '<div class="card">' + banner + picker + '</div>';
}

function heatmap() {
  const weeks = 20, cells = [];
  const end = new Date();
  end.setHours(0, 0, 0, 0);
  const startOffset = (end.getDay() + 6) % 7;
  const start = new Date(end.getTime() - (weeks * 7 - 1 - (6 - startOffset)) * 86400000);

  let html = '<div class="heat">';
  for (let w = 0; w < weeks; w++) {
    html += '<div class="heat-col">';
    for (let d = 0; d < 7; d++) {
      const day = new Date(start.getTime() + (w * 7 + d) * 86400000);
      if (day > end) { html += '<span class="heat-cell" style="opacity:.25"></span>'; continue; }
      const n = ST().days[Store.dayKey(day)] || 0;
      const lvl = n === 0 ? '' : n < 10 ? ' l1' : n < 25 ? ' l2' : n < 50 ? ' l3' : ' l4';
      html += '<span class="heat-cell' + lvl + '" title="' + Store.dayKey(day) + ' · ' + n + ' odpowiedzi"></span>';
    }
    html += '</div>';
  }
  return html + '</div>';
}

/* ============================================================
   WSPÓLNE AKCJE
   ============================================================ */

function wireCommon() {
  view.addEventListener('click', (e) => {
    const sp = e.target.closest('[data-speak]');
    if (sp) { UI.speak({ ru: sp.dataset.speak, tr: sp.dataset.tr || null }, sp); return; }

    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    const cat = b.dataset.cat;

    switch (act) {
      case 'start-goal': { const n = Store.nextGoal(); if (n) startGoal(n.g); break; }
      case 'goto-path': go('path'); break;
      case 'back-vocab': go('vocab'); break;
      case 'back-grammar': go('grammar'); break;
      case 'review': startReview(); break;
      case 'quick': startQuick(); break;
      case 'weak': startWeak(); break;
      case 'match': startMatch(null); break;
      case 'typing': startTyping(null); break;
      case 'learn-cat': startVocabSession(cat); break;
      case 'flash-cat': startFlash(cat); break;
      case 'type-cat': startTyping(cat); break;
      case 'match-cat': startMatch(cat); break;
      case 'listen-cat': startListen(cat); break;
      case 'drill-mod': startDrill(b.dataset.mod); break;
      case 'tts-toggle': ST().settings.tts = !ST().settings.tts; Store.commit(); render(); break;
      case 'tts-test': UI.speak({ ru: 'Здравствуйте, я говорю по-русски', tr: 'zdrastwujtie ja gawariu pa ruski' }); break;
      case 'accent-set':
        ST().settings.accent = b.dataset.accent || null;
        Store.save(); applyAccent(); render();
        break;
      case 'export': exportData(); break;
      case 'wipe': wipe(); break;
    }
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify(ST(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'russkij-put-' + Store.today() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  UI.toast('Kopia zapisana', 'Plik trafił do folderu pobrań');
}

function wipe() {
  if (!confirm('To skasuje cały postęp: słówka, cele, odznaki i notatki. Na pewno?')) return;
  Store.resetAll();
  UI.toast('Wyczyszczono', 'Zaczynamy od nowa');
  go('home');
  render();
}

/* ============================================================
   SILNIK SESJI
   ============================================================ */

function newSession(cfg) {
  Store.markTimeFlags();
  session = Object.assign({
    i: 0, correct: 0, combo: 0, best: 0, wrongIds: [],
    startedAt: Date.now(), answered: false, gainedXp: 0,
  }, cfg);
  ST().stats.sessions++;
  renderSession();
}

function endSession() {
  stopClock();
  const sess = session;
  const secs = Math.round((Date.now() - sess.startedAt) / 1000);
  const total = sess.items.length;
  const pct = total ? Math.round((sess.correct / total) * 100) : 0;

  let xp = sess.correct * 4 + (pct === 100 && total >= 10 ? 25 : 0);
  if (sess.onFinish) xp += sess.onFinish(sess, pct) || 0;
  if (pct === 100 && total >= 20) ST().flags_perfect = true;
  ST().stats.bestCombo = Math.max(ST().stats.bestCombo, sess.best);

  /* Podwójne XP zużywa się dokładnie na tej sesji, na której je włączono */
  const doubled = sess.x2;
  if (doubled) xp *= 2;

  Store.raise('acc', pct);
  if (pct === 100 && total >= 8) Store.bump('perfect');

  const reward = Store.sessionReward(sess.correct, total, sess.best);
  Store.addCoins(reward.coins);
  Store.addXp(xp);
  const res = Store.commit();

  resetView('view enter');
  view.innerHTML =
    '<div class="summary">' +
      '<span class="eyebrow">' + esc(sess.title) + '</span>' +
      '<div class="summary-score" id="scorenum">' + pct + '<small>%</small></div>' +
      '<h2 style="margin-bottom:22px">' + verdictWord(pct) + '</h2>' +
      '<div style="text-align:left;max-width:400px;margin:0 auto 26px">' +
        sLine('Poprawne', sess.correct + ' / ' + total) +
        sLine('Najdłuższa seria', sess.best) +
        sLine('Czas', fmtTime(secs)) +
        sLine('Zdobyte XP', '+' + xp + (doubled ? '  (×2)' : '')) +
        reward.parts.map((p) => sLine(p[0], '+' + p[1] + ' ₽')).join('') +
        sLine('Razem rubli', '+' + reward.coins + ' ₽') +
        (res.goals.length ? sLine('Zamknięte cele', res.goals.length) : '') +
      '</div>' +
      (sess.wrongIds.length
        ? '<p class="dim" style="font-size:13px">' + sess.wrongIds.length + ' ' +
          UI.plural(sess.wrongIds.length, 'pozycja wróci', 'pozycje wrócą', 'pozycji wróci') + ' w powtórkach.</p>'
        : '') +
      '<div class="now-actions" style="justify-content:center">' +
        (sess.repeat ? '<button class="btn primary" data-act="again">Jeszcze raz</button>' : '') +
        '<button class="btn" data-act="next-goal">Następny cel →</button>' +
        '<button class="btn ghost" data-act="home">Pulpit</button>' +
      '</div>' +
    '</div>';

  if (pct >= 80) UI.burst(innerWidth / 2, innerHeight * 0.3, pct === 100 ? 80 : 40);

  const repeat = sess.repeat;
  session = null;
  paintHud();
  paintNav();

  view.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'again' && repeat) repeat();
    if (b.dataset.act === 'home') { go('home'); render(); }
    if (b.dataset.act === 'next-goal') {
      const n = Store.nextGoal();
      if (n) startGoal(n.g); else { go('home'); render(); }
    }
  });
}

function sLine(l, v) {
  return '<div class="summary-line"><span class="l">' + esc(l) + '</span><span class="v">' + esc(v) + '</span></div>';
}

function verdictWord(pct) {
  if (pct === 100) return 'Идеально · bezbłędnie';
  if (pct >= 90) return 'Отлично · świetnie';
  if (pct >= 75) return 'Хорошо · dobrze';
  if (pct >= 50) return 'Неплохо · nieźle';
  return 'Ещё раз · jeszcze raz';
}

function sessTop() {
  const total = session.items.length;
  const pct = Math.round((session.i / total) * 100);
  return (
    '<div class="sess-top">' +
      '<button class="btn sm ghost" data-act="quit">✕</button>' +
      bar(pct) +
      '<span class="sess-count">' + (session.i + 1) + '/' + total + '</span>' +
      (session.combo >= 3 ? '<span class="combo">×' + session.combo + '</span>' : '') +
      (session.exam ? '<span class="sess-count mono" id="clock">' + fmtTime(elapsed()) + '</span>' : '') +
    '</div>'
  );
}

function elapsed() {
  return Math.round((Date.now() - session.startedAt) / 1000);
}

/* Zegar egzaminu — jeden interwał na pytanie, sprzątany przy każdej zmianie ekranu */
function stopClock() {
  if (session && session.clockId) { clearInterval(session.clockId); session.clockId = null; }
}

function startClock() {
  stopClock();
  session.clockId = setInterval(() => {
    const el = document.getElementById('clock');
    if (!el || !session) { stopClock(); return; }
    el.textContent = fmtTime(elapsed());
  }, 1000);
}

function renderSession() {
  if (!session) { render(); return; }
  if (session.i >= session.items.length) { endSession(); return; }
  resetView('view');
  view.innerHTML = '<div class="session" id="sess"></div>';
  const box = $('#sess');
  const item = session.items[session.i];
  session.answered = false;

  const kinds = Object.assign(
    { choice: renderChoice, flash: renderFlash, type: renderType, match: renderMatch },
    App.KINDS
  );
  (kinds[item.kind] || renderChoice)(box, item);
  mountItems(box, item);
  if (session.exam) startClock();

  box.addEventListener('click', (e) => {
    if (e.target.closest('[data-act="quit"]')) {
      if (session.i > 0) Store.commit();
      stopClock();
      session = null;
      render();
    }
    const sp = e.target.closest('[data-speak]');
    if (sp) UI.speak({ ru: sp.dataset.speak, tr: sp.dataset.tr || null }, sp);
  });
}

/* ------------------------------------------------------------
   Ekwipunek w trakcie sesji
   ------------------------------------------------------------ */

const ITEM_FIT = {
  hint:   (it) => it.kind === 'choice' && it.options && it.options.length > 2,
  skip:   () => true,
  letter: (it) => it.kind === 'type',
  retry:  () => true,
  x2:     () => true,
};

function mountItems(box, item) {
  const owned = SHOP.filter((s) => s.kind === 'use' && Store.itemCount(s.id) > 0);
  if (!owned.length) return;

  const bar = h('<div class="items" id="items"></div>');
  bar.innerHTML = owned.map((s) => {
    const fits = ITEM_FIT[s.id] ? ITEM_FIT[s.id](item) : false;
    const spent = (s.id === 'retry' && session.shield) || (s.id === 'x2' && session.x2);
    const late = s.id === 'x2' && session.i > 0;
    const off = !fits || spent || late || session.answered;
    return '<button class="item-btn" data-item="' + s.id + '"' + (off ? ' disabled' : '') +
      ' title="' + esc(s.pl + ' — ' + s.desc) + '">' +
      '<span class="i">' + esc(s.icon) + '</span>' +
      '<span class="n">' + Store.itemCount(s.id) + '</span>' +
    '</button>';
  }).join('');
  box.appendChild(bar);

  bar.addEventListener('click', (e) => {
    const b = e.target.closest('[data-item]');
    if (!b || b.disabled) return;
    applyItem(b.dataset.item, item);
  });
}

function applyItem(id, item) {
  if (!Store.useItem(id)) return;

  if (id === 'hint') {
    const nodes = Array.from($('#opts').querySelectorAll('.opt'));
    const wrong = nodes.filter((n, i) => i !== item.answer && !n.classList.contains('faded'));
    UI.shuffle(wrong).slice(0, 2).forEach((n) => { n.classList.add('faded'); n.disabled = true; });
    UI.toast('Podpowiedź', 'Zostały dwie możliwości');
  }
  if (id === 'skip') {
    UI.toast('Pominięte', 'Bez straty serii');
    session.answered = true;
    advance(160);
  }
  if (id === 'letter') {
    const input = $('#tin');
    if (input) { input.value = item.word.ru[0]; input.focus(); }
  }
  if (id === 'retry') {
    session.shield = true;
    UI.toast('Druga szansa', 'Pierwszy błąd nie policzy się do serii');
  }
  if (id === 'x2') {
    session.x2 = true;
    UI.toast('Podwójne XP', 'Aktywne do końca tej sesji');
  }
  renderItems(item);
}

function renderItems(item) {
  const old = $('#items');
  if (!old) return;
  const box = old.parentElement;
  old.remove();
  mountItems(box, item);
}

function advance(delay) {
  setTimeout(() => {
    session.i++;
    renderSession();
    paintHud();
  }, delay == null ? 900 : delay);
}

function scoreAnswer(ok, wordId) {
  session.answered = true;

  /* Tarcza z „drugiej szansy” zamienia pierwszy błąd w sesji w remis:
     nie kasuje serii i nie cofa słowa w powtórkach. */
  let counted = ok;
  if (!ok && session.shield) {
    session.shield = false;
    counted = true;
    UI.toast('Tarcza zużyta', 'Ten błąd nie liczy się do serii');
  }

  Store.logAnswer(ok);
  if (session.grammarCat != null) {
    Store.bump('gram');
    Store.noteTopic(session.grammarCat, ok);
  }

  if (ok) session.correct++;

  if (counted) {
    session.combo++;
    session.best = Math.max(session.best, session.combo);
    Store.raise('combo', session.combo);
    if (session.combo === 5 || session.combo === 10 || session.combo === 20) {
      UI.toast('Seria ×' + session.combo, 'Nie zatrzymuj się');
    }
  } else {
    session.combo = 0;
    if (wordId) session.wrongIds.push(wordId);
  }
  return counted;
}

/* ---------- tryb: wybór z czterech ---------- */

function renderChoice(box, item) {
  const speakBtn = item.speak
    ? '<button class="speak" data-speak="' + esc(item.speak) + '" data-tr="' + esc(item.speakTr || '') + '" title="Posłuchaj">♪</button>' : '';

  box.innerHTML =
    sessTop() +
    '<div class="prompt">' +
      '<span class="prompt-kind">' + esc(item.kindLabel || 'Wybierz odpowiedź') + '</span>' + speakBtn +
      (item.big ? '<div class="prompt-word cyr">' + esc(item.big) + '</div>' : '') +
      (item.q ? '<div class="prompt-q">' + esc(item.q) + '</div>' : '') +
      (item.tr ? '<div class="prompt-tr">' + esc(item.tr) + '</div>' : '') +
    '</div>' +
    '<div class="opts" id="opts">' +
      item.options.map((o, i) => {
        /* Szeryf niesie rosyjski; polskie odpowiedzi zostają w kroju interfejsu */
        const ru = CYR.test(o);
        return '<button class="opt" data-i="' + i + '">' +
          '<span class="opt-key">' + (i + 1) + '</span>' +
          '<span' + (ru ? ' class="cyr"' : '') + ' style="font-size:' + (ru ? '22px' : '16px') + '">' + esc(o) + '</span>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<div id="verdict"></div>';

  if ((item.autoSpeak || Store.hasPerk('autoplay')) && item.speak) {
    setTimeout(() => UI.speak({ ru: item.speak, tr: item.speakTr || null }), 300);
  }

  const opts = $('#opts');
  opts.addEventListener('click', (e) => {
    const b = e.target.closest('.opt');
    if (b && !session.answered) answerChoice(+b.dataset.i, item);
  });
  session.keyHandler = (e) => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= item.options.length && !session.answered) answerChoice(n - 1, item);
  };
}

function answerChoice(idx, item) {
  const ok = idx === item.answer;
  session.grammarCat = item.gramCat || null;
  const counted = scoreAnswer(ok, item.wordId);
  if (item.wordId) Store.grade(item.wordId, counted ? (session.combo > 3 ? 3 : 2) : 0);
  if (item.onAnswer) item.onAnswer(ok);

  const nodes = $('#opts').querySelectorAll('.opt');
  nodes.forEach((n, i) => {
    n.disabled = true;
    if (i === idx) n.classList.add(ok ? 'good' : 'bad');
    if (!ok && i === item.answer) n.classList.add('reveal');
  });

  $('#verdict').innerHTML =
    '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' +
      '<div class="verdict-head">' + (ok ? 'Верно · dobrze' : 'Неверно · pudło') + '</div>' +
      (item.explain ? '<p>' + esc(item.explain) + '</p>' : '') +
      (item.hint ? '<div class="hint">' + esc(item.hint) + '</div>' : '') +
    '</div>';

  advance(ok ? 750 : 1900);
}

/* ---------- tryb: fiszka z samooceną ---------- */

function renderFlash(box, item) {
  const w = item.word;
  box.innerHTML =
    sessTop() +
    '<div class="flip" id="flip">' +
      '<div class="flip-in">' +
        '<div class="flip-face">' +
          '<span class="prompt-kind">' + (item.reverse ? 'Po polsku' : 'Po rosyjsku') + '</span>' +
          '<div class="prompt-word cyr">' + esc(item.reverse ? w.pl : w.ru) + '</div>' +
          '<div class="flip-hint">Kliknij, żeby odwrócić · spacja</div>' +
        '</div>' +
        '<div class="flip-face back">' +
          '<div class="prompt-word cyr">' + esc(item.reverse ? w.ru : w.pl) + '</div>' +
          '<div class="prompt-tr">' + esc(w.tr) + '</div>' +
          (w.ex ? '<div class="prompt-ex">' + esc(w.ex) + '<div class="pl">' + esc(w.exPl || '') + '</div></div>' : '') +
          '<div class="flip-hint">Jak poszło?</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div id="gradebox"></div>';

  const flip = $('#flip');
  const reveal = () => {
    if (flip.classList.contains('on')) return;
    flip.classList.add('on');
    UI.speak(w);
    $('#gradebox').innerHTML =
      '<div class="grade">' +
        '<button class="btn g0" data-g="0">Nie znam<small>od nowa</small></button>' +
        '<button class="btn g1" data-g="1">Z trudem<small>wkrótce</small></button>' +
        '<button class="btn g2" data-g="2">Dobrze<small>za kilka dni</small></button>' +
        '<button class="btn g3" data-g="3">Od ręki<small>za tydzień+</small></button>' +
      '</div>';
    $('#gradebox').addEventListener('click', (e) => {
      const b = e.target.closest('[data-g]');
      if (!b || session.answered) return;
      const g = +b.dataset.g;
      scoreAnswer(g >= 2, g < 2 ? w.id : null);
      Store.grade(w.id, g);
      advance(220);
    });
  };
  flip.addEventListener('click', reveal);
  session.keyHandler = (e) => {
    if (e.code === 'Space') { e.preventDefault(); reveal(); }
    const n = parseInt(e.key, 10);
    if (flip.classList.contains('on') && n >= 1 && n <= 4 && !session.answered) {
      const g = n - 1;
      scoreAnswer(g >= 2, g < 2 ? w.id : null);
      Store.grade(w.id, g);
      advance(220);
    }
  };
}

/* ---------- tryb: wpisz po rosyjsku ---------- */

const KEYS = [
  'йцукенгшщзхъ',
  'фывапролджэ',
  'ячсмитьбюё',
];

function renderType(box, item) {
  const w = item.word;
  box.innerHTML =
    sessTop() +
    '<div class="prompt">' +
      '<span class="prompt-kind">Napisz po rosyjsku</span>' +
      '<div class="prompt-word">' + esc(w.pl) + '</div>' +
      (item.showTr ? '<div class="prompt-tr">' + esc(w.tr) + '</div>' : '') +
    '</div>' +
    '<div class="typebox">' +
      '<input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="wpisz cyrylicą…">' +
      '<button class="btn primary" data-act="check">Sprawdź</button>' +
    '</div>' +
    '<div class="keyb" id="kb">' +
      KEYS.map((r) => r.split('').map((c) => '<button data-k="' + c + '">' + c + '</button>').join('')).join('') +
      '<button data-k=" " class="wide">spacja</button>' +
      '<button data-k="\\b" class="wide">⌫</button>' +
    '</div>' +
    '<div style="text-align:center"><button class="btn sm ghost" data-act="dunno">Nie wiem — pokaż</button></div>' +
    '<div id="verdict"></div>';

  const input = $('#tin');
  input.focus();

  $('#kb').addEventListener('click', (e) => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    const k = b.dataset.k;
    if (k === '\\b') input.value = input.value.slice(0, -1);
    else input.value += k;
    input.focus();
  });

  const check = (giveUp) => {
    if (session.answered) return;
    const guess = norm(input.value);
    const target = norm(w.ru);
    const ok = !giveUp && guess === target;
    const counted = scoreAnswer(ok, ok ? null : w.id);
    Store.grade(w.id, counted ? 3 : 0);
    if (ok) { ST().stats.typed++; Store.bump('typed'); }
    input.classList.add(ok ? 'good' : 'bad');
    input.disabled = true;
    UI.speak(w);
    $('#verdict').innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' +
        '<div class="verdict-head">' + (ok ? 'Верно · dobrze' : 'Poprawnie: ' + esc(w.ru)) + '</div>' +
        '<p>' + esc(w.tr) + (w.ex ? ' · ' + esc(w.ex) : '') + '</p>' +
      '</div>';
    advance(ok ? 800 : 2200);
  };

  box.addEventListener('click', (e) => {
    if (e.target.closest('[data-act="check"]')) check(false);
    if (e.target.closest('[data-act="dunno"]')) check(true);
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(false); });
  session.keyHandler = null;
}

function norm(s) {
  return String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^а-я\s]/g, '').replace(/\s+/g, ' ').trim();
}

/* ---------- tryb: dopasuj pary ---------- */

function renderMatch(box, item) {
  const pairs = item.pairs;
  const left = shuffle(pairs.slice());
  const right = shuffle(pairs.slice());
  let sel = null, hits = 0, misses = 0;

  box.innerHTML =
    sessTop() +
    '<div class="prompt" style="padding:20px"><span class="prompt-kind">Dopasuj pary</span>' +
      '<div class="prompt-q">Połącz rosyjskie słowa z polskimi znaczeniami</div></div>' +
    '<div class="match">' +
      '<div class="match-col">' + left.map((p) =>
        '<button class="match-item" data-side="l" data-id="' + p.id + '"><span class="ru">' + esc(p.ru) + '</span></button>').join('') + '</div>' +
      '<div class="match-col">' + right.map((p) =>
        '<button class="match-item" data-side="r" data-id="' + p.id + '">' + esc(p.pl) + '</button>').join('') + '</div>' +
    '</div>';

  box.addEventListener('click', (e) => {
    const b = e.target.closest('.match-item');
    if (!b || b.classList.contains('hit')) return;

    if (!sel) {
      box.querySelectorAll('.match-item.sel').forEach((n) => n.classList.remove('sel'));
      sel = b;
      b.classList.add('sel');
      const p = pairs.find((x) => x.id === b.dataset.id);
      if (b.dataset.side === 'l' && p) UI.speak(p);
      return;
    }
    if (sel === b) { b.classList.remove('sel'); sel = null; return; }
    if (sel.dataset.side === b.dataset.side) {
      box.querySelectorAll('.match-item.sel').forEach((n) => n.classList.remove('sel'));
      sel = b; b.classList.add('sel'); return;
    }

    if (sel.dataset.id === b.dataset.id) {
      sel.classList.remove('sel'); sel.classList.add('hit'); b.classList.add('hit');
      Store.grade(b.dataset.id, 2);
      hits++;
      sel = null;
      if (hits === pairs.length) {
        scoreAnswer(misses === 0, null);
        for (let k = 1; k < pairs.length; k++) { Store.logAnswer(true); session.correct++; }
        UI.burst(innerWidth / 2, innerHeight / 2, 30);
        advance(700);
      }
    } else {
      const a = sel;
      a.classList.add('miss'); b.classList.add('miss');
      Store.grade(b.dataset.id, 0);
      misses++;
      session.combo = 0;
      setTimeout(() => { a.classList.remove('miss', 'sel'); b.classList.remove('miss'); }, 440);
      sel = null;
    }
  });
  session.keyHandler = null;
}

/* ============================================================
   BUDOWANIE SESJI
   ============================================================ */

function distractors(word, key, n) {
  const pool = WORDS.filter((w) => w.cat === word.cat && w.id !== word.id);
  const extra = WORDS.filter((w) => w.id !== word.id);
  const chosen = [];
  const seen = new Set([word[key]]);
  for (const src of [shuffle(pool), shuffle(extra)]) {
    for (const w of src) {
      if (chosen.length >= n) break;
      if (seen.has(w[key])) continue;
      seen.add(w[key]);
      chosen.push(w[key]);
    }
    if (chosen.length >= n) break;
  }
  return chosen;
}

function choiceItem(word, dir) {
  const ruToPl = dir === 'ru>pl';
  const key = ruToPl ? 'pl' : 'ru';
  const correct = word[key];
  const options = shuffle([correct].concat(distractors(word, key, 3)));
  return {
    kind: 'choice',
    wordId: word.id,
    kindLabel: ruToPl ? 'Co to znaczy?' : 'Jak to po rosyjsku?',
    big: ruToPl ? word.ru : null,
    q: ruToPl ? null : word.pl,
    tr: ruToPl ? word.tr : null,
    speak: word.ru,
    speakTr: word.tr,
    bigOptions: !ruToPl,
    options,
    answer: options.indexOf(correct),
    explain: word.ru + ' · ' + word.pl + ' · ' + word.tr,
    hint: word.ex ? word.ex + (word.exPl ? '  —  ' + word.exPl : '') : null,
  };
}

function listenItem(word) {
  const options = shuffle([word.pl].concat(distractors(word, 'pl', 3)));
  return {
    kind: 'choice',
    wordId: word.id,
    kindLabel: 'Posłuchaj i wybierz',
    big: '♪',
    speak: word.ru,
    speakTr: word.tr,
    autoSpeak: true,
    options,
    answer: options.indexOf(word.pl),
    explain: word.ru + ' · ' + word.tr,
  };
}

/* Dobór ćwiczenia do stopnia znajomości słowa */
function itemForWord(w) {
  const c = ST().srs[w.id];
  const b = c ? c.b : 0;
  const seen = c && c.s > 0;
  if (!seen) return choiceItem(w, 'ru>pl');
  if (b <= 1) return Math.random() < 0.5 ? choiceItem(w, 'ru>pl') : choiceItem(w, 'pl>ru');
  if (b <= 2) return choiceItem(w, 'pl>ru');
  if (b <= 3) return UI.canSpeak() && Math.random() < 0.4 ? listenItem(w) : { kind: 'type', word: w, showTr: true };
  return { kind: 'type', word: w };
}

function startVocabSession(catId) {
  const cat = CATS.find((c) => c.id === catId);
  const all = WORDS.filter((w) => w.cat === catId);
  const now = Date.now();
  const fresh = all.filter((w) => !ST().srs[w.id] || ST().srs[w.id].s === 0);
  const due = all.filter((w) => ST().srs[w.id] && ST().srs[w.id].s > 0 && ST().srs[w.id].d <= now);
  const rest = all.filter((w) => !fresh.includes(w) && !due.includes(w));

  /* Siedem nowych, pięć z kolejki — a gdy któraś pula jest pusta,
     dobieramy z pozostałych, żeby sesja zawsze miała pełne dwanaście pozycji. */
  const chosen = pick(fresh, 7).concat(pick(due, 5));
  const taken = new Set(chosen.map((w) => w.id));
  const filler = shuffle(fresh.concat(due, rest).filter((w) => !taken.has(w.id)));
  while (chosen.length < 12 && filler.length) chosen.push(filler.shift());
  if (!chosen.length) { UI.toast('Nic do nauki', 'Ten temat masz opanowany'); return; }

  newSession({
    title: cat ? cat.name : 'Nauka słówek',
    items: shuffle(chosen).map(itemForWord),
    repeat: () => startVocabSession(catId),
  });
}

function startFlash(catId) {
  const all = catId ? WORDS.filter((w) => w.cat === catId) : WORDS;
  const chosen = pick(all, Math.min(15, all.length));
  newSession({
    title: 'Fiszki' + (catId ? ' · ' + CATS.find((c) => c.id === catId).name : ''),
    items: chosen.map((w) => ({ kind: 'flash', word: w, reverse: Math.random() < 0.3 })),
    repeat: () => startFlash(catId),
  });
}

function startTyping(catId) {
  const all = (catId ? WORDS.filter((w) => w.cat === catId) : WORDS)
    .filter((w) => w.ru.length <= 14 && !w.ru.includes('?'));
  const seenFirst = all.filter((w) => ST().srs[w.id] && ST().srs[w.id].s > 0);
  const pool = seenFirst.length >= 10 ? seenFirst : all;
  newSession({
    title: 'Wpisz z pamięci',
    items: pick(pool, 12).map((w) => ({ kind: 'type', word: w, showTr: !catId })),
    repeat: () => startTyping(catId),
  });
}

function startListen(catId) {
  if (!UI.canSpeak()) { UI.toast('Brak syntezatora mowy', 'Ta przeglądarka nie umie czytać po rosyjsku'); return; }
  const all = catId ? WORDS.filter((w) => w.cat === catId) : WORDS;
  newSession({
    title: 'Ze słuchu',
    items: pick(all, 12).map(listenItem),
    repeat: () => startListen(catId),
  });
}

function startMatch(catId) {
  const all = catId ? WORDS.filter((w) => w.cat === catId) : WORDS;
  const rounds = 4;
  const items = [];
  const used = new Set();
  for (let r = 0; r < rounds; r++) {
    const batch = [];
    const shuffled = shuffle(all);
    for (const w of shuffled) {
      if (batch.length >= 5) break;
      if (used.has(w.id)) continue;
      used.add(w.id);
      batch.push({ id: w.id, ru: w.ru, pl: w.pl, tr: w.tr });
    }
    if (batch.length === 5) items.push({ kind: 'match', pairs: batch });
  }
  if (!items.length) { UI.toast('Za mało słów', 'Wybierz szerszy zakres'); return; }
  newSession({ title: 'Dopasuj pary', items, repeat: () => startMatch(catId) });
}

function startReview() {
  const due = Store.dueCards();
  if (!due.length) {
    UI.toast('Kolejka pusta', 'Wróć później albo poznaj nowe słowa');
    return;
  }
  const words = due.map((id) => WORDS.find((w) => w.id === id)).filter(Boolean);
  const chosen = pick(words, Math.min(20, words.length));
  newSession({
    title: 'Powtórki',
    items: chosen.map((w) => (Math.random() < 0.35
      ? { kind: 'flash', word: w, reverse: false }
      : itemForWord(w))),
    repeat: () => startReview(),
  });
}

function startQuick() {
  const seen = WORDS.filter((w) => ST().srs[w.id] && ST().srs[w.id].s > 0);
  const pool = seen.length >= 10 ? seen : WORDS;
  newSession({
    title: 'Szybka runda',
    items: pick(pool, 10).map(itemForWord),
    repeat: () => startQuick(),
  });
}

function startWeak() {
  const weak = Store.weakWords(20);
  if (!weak.length) {
    UI.toast('Brak słabych punktów', 'Jeszcze nic Cię nie pokonało');
    return;
  }
  newSession({
    title: 'Słabe punkty',
    items: pick(weak, Math.min(12, weak.length)).map((w) => choiceItem(w, Math.random() < 0.5 ? 'ru>pl' : 'pl>ru')),
    repeat: () => startWeak(),
  });
}

/* ---------- moduły gramatyczne ---------- */

function quizItem(q) {
  const opts = q.options.slice();
  return {
    kind: 'choice',
    kindLabel: q.cat || 'Gramatyka',
    gramCat: q.cat || 'Gramatyka',
    q: q.q,
    options: opts,
    answer: q.answer,
    bigOptions: opts.some((o) => CYR.test(o)),
    hint: q.hint || null,
    speak: CYR.test(opts[q.answer]) ? opts[q.answer] : null,
  };
}

function startQuiz(mod, secIdx) {
  const sec = mod.sections[secIdx];
  if (!sec) return;
  newSession({
    title: mod.title + ' · ' + sec.title,
    items: shuffle(sec.questions).map(quizItem),
    repeat: () => startQuiz(mod, secIdx),
    onFinish: (sess) => {
      const st = Store.modState(mod.id);
      const prev = st.sec[secIdx];
      if (prev == null || sess.correct > prev) st.sec[secIdx] = sess.correct;
      return 20;
    },
  });
}

function startDrill(modId) {
  const mod = MODULES.find((m) => m.id === modId);
  if (!mod) return;
  const all = [];
  mod.sections.forEach((s) => s.questions.forEach((q) => all.push(q)));
  newSession({
    title: mod.title + ' · trening',
    items: pick(all, Math.min(20, all.length)).map(quizItem),
    repeat: () => startDrill(modId),
    onFinish: (sess) => {
      ST().drill[modId] = (ST().drill[modId] || 0) + sess.correct;
      return 15;
    },
  });
}

/* ---------- egzaminy ---------- */

function startExam(examId) {
  const ex = EXAMS.find((e) => e.id === examId);
  if (!ex) return;
  newSession({
    title: ex.title,
    items: shuffle(ex.questions).map(quizItem),
    repeat: () => startExam(examId),
    exam: ex,
    onFinish: (sess, pct) => {
      const prev = ST().exams[examId];
      const rec = {
        best: Math.max(prev ? prev.best : 0, sess.correct),
        total: sess.items.length,
        attempts: (prev ? prev.attempts : 0) + 1,
        last: sess.correct,
        ts: Date.now(),
      };
      ST().exams[examId] = rec;
      return pct >= 80 ? 120 : pct >= 60 ? 60 : 20;
    },
  });
}

/* ============================================================
   KLAWIATURA I START
   ============================================================ */

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (session && session.keyHandler) session.keyHandler(e);
  if (e.key === 'Escape' && session) { stopClock(); session = null; render(); }
});

function applyAccent() {
  const a = ST().settings.accent;
  document.documentElement.dataset.accent = (a && Store.hasPerk('accent_' + a)) ? a : '';
}

function boot() {
  if (window.Speech) Speech.init();
  buildShell();
  applyAccent();

  /* Zamrożenie passy działa samo, zanim policzymy cokolwiek innego */
  if (Store.applyFreeze()) {
    Store.save();
    setTimeout(() => UI.toast('Passa uratowana', 'Zużyto jedno zamrożenie'), 900);
  }

  if (!location.hash) location.hash = '#/home';
  render();

  const s = ST();
  if (s.lastDay && s.lastDay !== Store.today() && Store.streakAlive()) {
    setTimeout(() => UI.toast('Passa żyje: ' + s.streak + ' dni', 'Jedna sesja dziś i lecisz dalej'), 700);
  }
  const due = Store.dueCount();
  if (due >= 10) {
    setTimeout(() => UI.toast(due + ' kart czeka', 'Powtórki to najtańszy sposób na zapamiętanie'), 1300);
  }
}

/* Skrypty stoją na końcu body, ale w niektórych trybach podglądu wykonują się
   dopiero po DOMContentLoaded — wtedy nasłuch by nigdy nie zadziałał. */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
})();

</script>
<script>/* js\views2.js */
(function () {
/* ============================================================
   EKRANY DODATKOWE
   Zadania poboczne · Sklep · Klawiatura · Układacz zdań · Czytelnia
   Rejestrują się w App.VIEWS i App.KINDS, żeby app.js nie puchł.
   ============================================================ */

const { h, esc, shuffle, pick, bar, fmtTime } = UI;
const ST = () => Store.s;
const $ = (s, r) => (r || App.view).querySelector(s);

function head(eyebrow, title, lead, actions) {
  return '<div class="view-head">' +
    '<span class="eyebrow">' + esc(eyebrow) + '</span>' +
    '<h1>' + esc(title) + '</h1>' +
    (lead ? '<p>' + esc(lead) + '</p>' : '') +
    (actions ? '<div class="now-actions">' + actions + '</div>' : '') +
  '</div>';
}

/* ============================================================
   ZADANIA POBOCZNE
   ============================================================ */

function viewQuests() {
  const v = App.view;
  const quests = Store.dailyQuests();
  const weakT = Store.weakTopics();
  const weakW = Store.weakWords(40);
  const due = Store.dueCount();

  const questCards = quests.map((q) => {
    const p = Store.questProgress(q);
    const claimed = Store.questClaimed(q);
    const pct = Math.round((p.now / p.max) * 100);
    return (
      '<div class="quest' + (claimed ? ' done' : '') + '">' +
        '<div class="quest-top">' +
          '<div>' +
            '<div class="quest-ru cyr">' + esc(q.ru) + '</div>' +
            '<div class="quest-pl">' + esc(q.pl) + '</div>' +
          '</div>' +
          '<div class="quest-pay">' +
            '<span class="coin">+' + q.coin + ' ₽</span>' +
            '<span class="dim">+' + q.xp + ' XP</span>' +
          '</div>' +
        '</div>' +
        '<p class="quest-desc">' + esc(q.desc) + '</p>' +
        bar(pct, claimed ? 'green' : '') +
        '<div class="quest-foot">' +
          (claimed ? '<span class="chip green">Odebrane</span>'
                   : '<span class="mono">' + p.now + ' / ' + p.max + '</span>') +
        '</div>' +
      '</div>'
    );
  }).join('');

  /* Sesje naprawcze — proponowane tylko wtedy, gdy naprawdę jest co naprawiać */
  const fixes = [];
  if (due > 0) {
    fixes.push(fixCard('Kolejka powtórek', due + ' ' + UI.plural(due, 'karta czeka', 'karty czekają', 'kart czeka'),
      'Najtańszy sposób, żeby nie stracić tego, co już umiesz.', 'review', null));
  }
  if (weakW.length >= 5) {
    fixes.push(fixCard('Słowa, które uciekają', weakW.length + ' ' + UI.plural(weakW.length, 'słowo', 'słowa', 'słów'),
      'Te pomyliłeś najczęściej. Sesja złożona wyłącznie z nich.', 'weak', null));
  }
  weakT.slice(0, 4).forEach((t) => {
    const pct = Math.round(t.rate * 100);
    fixes.push(fixCard(t.cat, pct + '% błędów',
      'Na ' + t.n + ' pytań z tego tematu pomyliłeś ' + t.bad + '. Powtórka skupiona na tym jednym.',
      'fix-topic', t.cat));
  });

  const noFix =
    '<div class="empty"><div class="g cyr">✓</div>' +
    'Nie ma czego naprawiać. Kolejka pusta, żaden temat Cię nie gubi.<br>' +
    'Wróć tu po kilku sesjach — wtedy będzie z czego wyciągać wnioski.</div>';

  v.innerHTML =
    head('Odświeżają się codziennie o północy', 'Zadania',
      'Trzy wyzwania na dziś i osobna lista tego, co warto nadrobić. Nic tu nie blokuje ścieżki — to dodatek dla chętnych.') +
    '<div class="group-head"><h3>Na dziś</h3><span class="d">losowane raz dziennie</span></div>' +
    '<div class="grid g3 stagger">' + questCards + '</div>' +
    '<div class="group-head"><h3>Do nadrobienia</h3><span class="d">wyliczone z Twoich błędów</span></div>' +
    (fixes.length ? '<div class="grid g2 stagger">' + fixes.join('') + '</div>' : noFix);

  v.addEventListener('click', (e) => {
    const b = e.target.closest('[data-fix]');
    if (!b) return;
    if (b.dataset.fix === 'fix-topic') startTopicFix(b.dataset.topic);
  });
  App.wireCommon();
}

function fixCard(title, badge, desc, act, topic) {
  return (

/* Sesja naprawcza z jednego tematu gramatycznego */
function startTopicFix(cat) {
  const all = [];
  MODULES.forEach((m) => m.sections.forEach((s) =>
    s.questions.forEach((q) => { if ((q.cat || s.title) === cat) all.push(q); })));
  EXAMS.forEach((e) => e.questions.forEach((q) => { if (q.cat === cat) all.push(q); }));

  if (!all.length) { UI.toast('Brak pytań', 'Nie mam materiału akurat na ten temat'); return; }

  App.newSession({
    title: 'Naprawa: ' + cat,
    items: pick(all, Math.min(15, all.length)).map(quizItemLocal),
    repeat: () => startTopicFix(cat),
    onFinish: () => 25,
  });
}

function quizItemLocal(q) {
  const opts = q.options.slice();
  return {
    kind: 'choice',
    kindLabel: q.cat || 'Gramatyka',
    gramCat: q.cat || 'Gramatyka',
    q: q.q,
    options: opts,
    answer: q.answer,
    bigOptions: opts.some((o) => App.CYR.test(o)),
    hint: q.hint || null,
    speak: App.CYR.test(opts[q.answer]) ? opts[q.answer] : null,
  };
}

function viewKeyboard(lessonId) {

    '<div class="tiles">' +
      App.tile(kb.chars, 'wystukanych znaków', '', 'var(--amber)') +
      App.tile(kb.bestCpm, 'rekord zn/min', 'znaków na minutę', 'var(--jade)') +
      App.tile(Object.keys(kb.lessons).length + '/' + KB_LESSONS.length, 'lekcji', '', 'var(--iris)') +
      App.tile(kb.chars ? Math.round(((kb.chars - kb.errors) / kb.chars) * 100) + '%' : '—', 'celność', kb.errors + ' pomyłek', 'var(--coral)') +
    '</div>' +
    kbBoard(null, null) +
    '<div class="group-head"><h3>Lekcje</h3><span class="d">od rzędu podstawowego w górę</span></div>' +

/* Rysunek klawiatury; next = litera do podświetlenia */
function kbBoard(next, wrong) {
  const showHint = Store.hasPerk('keyhint');
  const rows = KB_ROWS.map((row, ri) =>
    '<div class="kbrow">' +
      (ri === 2 ? '<span class="kbpad"></span>' : '') +
      row.map((key) => {
        const hot = next && key.k === next;
        const cls = ['kbkey', 'f' + key.f];
        if (key.home) cls.push('home');
        if (hot) cls.push('next');
        if (hot && wrong) cls.push('wrong');
        return '<span class="' + cls.join(' ') + '" data-k="' + esc(key.k) + '">' + esc(key.k) + '</span>';
      }).join('') +
    '</div>').join('');

  const fingerName = next ? fingerFor(next) : null;
  return (
    '<div class="kbboard' + (showHint ? ' hinted' : '') + '">' +
      rows +
      '<div class="kbrow"><span class="kbkey space' + (next === ' ' ? ' next' : '') + '" data-k=" ">пробел</span></div>' +
      '<div class="kbfoot">' +
        (fingerName
          ? '<span class="chip gold">' + esc(FINGERS[fingerName].name) + '</span>'
          : '<span class="dim" style="font-size:12px">Palce spoczywają na <b class="cyr">фыва</b> i <b class="cyr">олдж</b> — wypustki są na <b class="cyr">а</b> i <b class="cyr">о</b>.</span>') +
      '</div>' +
    '</div>'
  );
}

function fingerFor(ch) {
  for (const row of KB_ROWS) {
    for (const key of row) if (key.k === ch) return key.f;
  }
  return null;
}

function kbLesson(id) {
  const v = App.view;
  const lesson = KB_LESSONS.find((l) => l.id === id);
  if (!lesson) { App.go('keyboard'); return; }

  let lines = lesson.drills ? lesson.drills.slice() : [];
  if (lesson.fromVocab) {
    const seen = WORDS.filter((w) => ST().srs[w.id] && !/[^а-яё ]/i.test(w.ru));
    const pool = (seen.length >= 20 ? seen : WORDS).filter((w) => !/[^а-яё ]/i.test(w.ru));
    for (let i = 0; i < 5; i++) lines.push(pick(pool, 4).map((w) => w.ru.toLowerCase()).join(' '));
  }
  if (lesson.fromSentences) {
    lines = pick(SENTENCES, 5).map((s) => s.ru.toLowerCase());
  }

  kbState = {
    lesson, lines, li: 0, pos: 0, typed: '',
    errors: 0, chars: 0, started: 0, wrong: false, done: false,
  };

  drawKb();
  document.addEventListener('keydown', kbKey);
}

function drawKb() {
  const k = kbState;
  if (!k) return;
  const v = App.resetView('view');
  const line = k.lines[k.li] || '';
  const next = k.done ? null : line[k.pos];

  const elapsed = k.started ? (Date.now() - k.started) / 60000 : 0;
  const cpm = elapsed > 0.02 ? Math.round(k.chars / elapsed) : 0;
  const acc = k.chars ? Math.round(((k.chars - k.errors) / k.chars) * 100) : 100;

  const chars = line.split('').map((c, i) => {
    let cls = 'kc';
    if (i < k.pos) cls += ' ok';
    else if (i === k.pos) cls += k.wrong ? ' cur bad' : ' cur';
    return '<span class="' + cls + '">' + (c === ' ' ? '&nbsp;' : esc(c)) + '</span>';
  }).join('');

  v.innerHTML =
    '<div class="session" style="max-width:820px">' +
      '<div class="sess-top">' +
        '<button class="btn sm ghost" data-act="kb-quit">✕</button>' +
        bar(Math.round((k.li / k.lines.length) * 100)) +
        '<span class="sess-count">' + (k.li + 1) + '/' + k.lines.length + '</span>' +
        '<span class="sess-count mono">' + cpm + ' zn/min</span>' +
        '<span class="sess-count mono">' + acc + '%</span>' +
      '</div>' +
      (k.done ? kbSummary(cpm, acc) :
        '<div class="kbline">' + chars + '</div>' +
        kbBoard(next, k.wrong) +
        '<p class="dim" style="text-align:center;font-size:12.5px;margin-top:16px">' +
          'Pisz na swojej klawiaturze — liczy się pozycja klawisza, nie to, jaki masz układ w systemie.' +
        '</p>') +
    '</div>';

  App.view.addEventListener('click', (e) => {
    if (e.target.closest('[data-act="kb-quit"]')) kbExit();
    if (e.target.closest('[data-act="kb-again"]')) kbLesson(k.lesson.id);
    if (e.target.closest('[data-act="kb-back"]')) kbExit();
  });
}

function kbSummary(cpm, acc) {
  return (
    '<div class="summary">' +
      '<span class="eyebrow">' + esc(kbState.lesson.title) + '</span>' +
      '<div class="summary-score">' + cpm + '<small> zn/min</small></div>' +
      '<h2>' + (cpm >= 120 ? 'Свободно · swobodnie' : cpm >= 70 ? 'Уверенно · pewnie' : 'Ещё раз · jeszcze raz') + '</h2>' +
      '<div style="text-align:left;max-width:400px;margin:0 auto 26px">' +
        '<div class="summary-line"><span class="l">Celność</span><span class="v">' + acc + '%</span></div>' +
        '<div class="summary-line"><span class="l">Znaki</span><span class="v">' + kbState.chars + '</span></div>' +
        '<div class="summary-line"><span class="l">Pomyłki</span><span class="v">' + kbState.errors + '</span></div>' +
      '</div>' +
      '<div class="now-actions" style="justify-content:center">' +
        '<button class="btn primary" data-act="kb-again">Jeszcze raz</button>' +
        '<button class="btn ghost" data-act="kb-back">Lista lekcji</button>' +
      '</div>' +
    '</div>'
  );
}

function kbKey(e) {
  const k = kbState;
  if (!k || k.done) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Escape') { kbExit(); return; }

  /* Litera z układu rosyjskiego, jeśli jest — inaczej z pozycji klawisza */
  let ch = null;
  if (e.key && e.key.length === 1 && /[а-яё ]/i.test(e.key)) ch = e.key.toLowerCase();
  else if (KB_CODES[e.code]) ch = KB_CODES[e.code];
  if (!ch) return;

  e.preventDefault();
  if (!k.started) k.started = Date.now();

  const line = k.lines[k.li];
  const want = line[k.pos];
  k.chars++;

  if (ch === want) {
    k.pos++;
    k.wrong = false;
    if (k.pos >= line.length) {
      k.li++;
      k.pos = 0;
      if (k.li >= k.lines.length) finishKb();
    }
  } else {
    k.errors++;
    k.wrong = true;
  }
  Store.bump('keys');
  drawKb();
}

function finishKb() {
  const k = kbState;
  k.done = true;
  const mins = (Date.now() - k.started) / 60000;
  const cpm = mins > 0 ? Math.round(k.chars / mins) : 0;
  const acc = k.chars ? Math.round(((k.chars - k.errors) / k.chars) * 100) : 100;

  const kb = ST().kb;
  kb.chars += k.chars;
  kb.errors += k.errors;
  kb.bestCpm = Math.max(kb.bestCpm, cpm);
  const prev = kb.lessons[k.lesson.id];
  if (!prev || cpm > prev.cpm) kb.lessons[k.lesson.id] = { cpm, acc, ts: Date.now() };

  const xp = Math.round(cpm / 3) + (acc >= 95 ? 25 : 0);
  Store.addXp(xp);
  Store.addCoins(Math.round(cpm / 6) + (acc === 100 ? 20 : 0));
  Store.commit();
  if (acc >= 95) UI.burst(innerWidth / 2, innerHeight / 3, 40);
}

function kbExit() {
  document.removeEventListener('keydown', kbKey);
  kbState = null;
  App.go('keyboard');
  App.render();
}

function viewSentences() {
  const v = App.view;
  const st = ST().sent;
  const levels = [
    { lvl: 1, name: 'Proste zdania', ru: 'Простые', desc: 'Teraźniejszość, szyk podstawowy' },
    { lvl: 2, name: 'Przypadki i przeszłość', ru: 'Падежи', desc: 'Odmiana w praktyce, sytuacje z życia' },
    { lvl: 3, name: 'Zdania złożone', ru: 'Сложные', desc: 'Spójniki, aspekt, tryb przypuszczający' },
    { lvl: 4, name: 'Mowa żywa', ru: 'Живая речь', desc: 'To, czego nie ma w podręczniku' },
  ];

  v.innerHTML =
    head(SENTENCES.length + ' zdań w czterech poziomach', 'Układacz zdań',
      'Pojedyncze słowa nie składają się same w zdanie. Tu ćwiczysz szyk, końcówki i to, czego rosyjski nie mówi wprost.') +
    '<div class="tiles">' +
      App.tile(st.done, 'ułożonych zdań', '', 'var(--amber)') +
      App.tile(st.done ? Math.round((st.ok / st.done) * 100) + '%' : '—', 'za pierwszym razem', '', 'var(--jade)') +
      App.tile(SENTENCES.length, 'zdań w bazie', '', 'var(--iris)') +
    '</div>' +
    '<div class="grid g2 stagger">' +
      levels.map((l) => {
        const total = SENTENCES.filter((s) => s.lvl === l.lvl).length;
        const done = (st.lvl && st.lvl[l.lvl]) || 0;
        const pct = Math.round((Math.min(done, total) / total) * 100);
        return (
          '<button class="cat" data-lvl="' + l.lvl + '">' +
            '<span class="cat-glyph num">' + l.lvl + '</span>' +
            '<div class="cat-ru cyr">' + esc(l.ru) + '</div>' +
            '<div class="cat-name">' + esc(l.name) + '</div>' +
            '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">' + esc(l.desc) + '</div>' +
            '<div class="cat-stat"><span>' + Math.min(done, total) + ' / ' + total + '</span><span>' + pct + '%</span></div>' +
            bar(pct, pct === 100 ? 'green' : '') +
          '</button>'
        );
      }).join('') +
    '</div>';

  v.addEventListener('click', (e) => {
    const b = e.target.closest('[data-lvl]');
    if (b) startSentences(+b.dataset.lvl);
  });
}

function startSentences(lvl) {
  const pool = SENTENCES.filter((s) => s.lvl === lvl);
  if (!pool.length) return;
  const chosen = pick(pool, Math.min(8, pool.length));

  App.newSession({
    title: 'Zdania · poziom ' + lvl,
    items: chosen.map((s, i) => (i % 3 === 2 ? sentenceChoice(s) : { kind: 'sentence', s })),
    repeat: () => startSentences(lvl),
    onFinish: (sess) => {
      const st = ST().sent;
      st.lvl = st.lvl || {};
      st.lvl[lvl] = (st.lvl[lvl] || 0) + sess.correct;
      return 20;
    },
  });
}

/* Wariant odwrotny: rosyjskie zdanie, wybierz polskie znaczenie */
function sentenceChoice(s) {
  const others = shuffle(SENTENCES.filter((x) => x !== s && x.lvl === s.lvl)).slice(0, 3).map((x) => x.pl);
  const options = shuffle([s.pl].concat(others));
  return {
    kind: 'choice',
    kindLabel: 'Co znaczy to zdanie?',
    big: s.ru,
    speak: s.ru,
    options,
    answer: options.indexOf(s.pl),
    explain: s.ru,
    hint: s.note || null,
  };
}

/* Kafelki do ułożenia */
function renderSentence(box, item) {
  const s = item.s;
  const words = s.ru.split(/\s+/);
  const decoys = shuffle(
    SENTENCES.filter((x) => x !== s).flatMap((x) => x.ru.split(/\s+/))
  ).filter((w) => !words.includes(w)).slice(0, words.length > 5 ? 2 : 3);

  const bank = shuffle(words.concat(decoys));
  let placed = [];

  box.innerHTML =
    App.sessTop() +
    '<div class="prompt" style="padding:30px 26px">' +
      '<span class="prompt-kind">Ułóż zdanie po rosyjsku</span>' +
      '<div class="prompt-q">' + esc(s.pl) + '</div>' +
    '</div>' +
    '<div class="slot" id="slot"><span class="slot-empty">Klikaj słowa w kolejności</span></div>' +
    '<div class="bank" id="bank">' +
      bank.map((w, i) => '<button class="tile-w" data-i="' + i + '">' + esc(w) + '</button>').join('') +
    '</div>' +
    '<div class="now-actions" style="justify-content:center;margin-top:18px">' +
      '<button class="btn primary" data-act="check-sent">Sprawdź</button>' +
      '<button class="btn ghost" data-act="clear-sent">Wyczyść</button>' +
    '</div>' +
    '<div id="verdict"></div>';

  const slot = $('#slot', box);
  const bankEl = $('#bank', box);

  const redraw = () => {
    slot.innerHTML = placed.length
      ? placed.map((p, i) => '<button class="tile-w in" data-p="' + i + '">' + esc(p.w) + '</button>').join('')
      : '<span class="slot-empty">Klikaj słowa w kolejności</span>';
  };

  bankEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-i]');
    if (!b || b.classList.contains('used') || App.session.answered) return;
    b.classList.add('used');
    placed.push({ w: b.textContent, el: b });
    redraw();
  });

  slot.addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]');
    if (!b || App.session.answered) return;
    const idx = +b.dataset.p;
    placed[idx].el.classList.remove('used');
    placed.splice(idx, 1);
    redraw();
  });

  const check = () => {
    if (App.session.answered) return;
    const guess = placed.map((p) => p.w).join(' ');
    const ok = guess === s.ru;
    App.scoreAnswer(ok, null);

    const st = ST().sent;
    st.done++;
    if (ok) st.ok++;
    Store.bump('sent');

    slot.querySelectorAll('.tile-w').forEach((n, i) => {
      n.classList.add(placed[i].w === words[i] ? 'good' : 'bad');
    });

    $('#verdict', box).innerHTML =
      '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' +
        '<div class="verdict-head">' + (ok ? 'Верно · dobrze' : 'Poprawnie: ' + esc(s.ru)) + '</div>' +
        '<p>' + esc(s.pl) + '</p>' +
        (s.note ? '<div class="hint">' + esc(s.note) + '</div>' : '') +
      '</div>';
    UI.speak({ ru: s.ru, tr: null });
    App.advance(ok ? 1400 : 3200);
  };

  box.addEventListener('click', (e) => {
    if (e.target.closest('[data-act="check-sent"]')) check();
    if (e.target.closest('[data-act="clear-sent"]') && !App.session.answered) {
      placed.forEach((p) => p.el.classList.remove('used'));
      placed = [];
      redraw();
    }
  });
}

let readText = '';

function normWord(w) {
  return w.toLowerCase().replace(/ё/g, 'е').replace(/[^а-я\- ]/g, '').trim();
}

/* Najpierw trafienie dokładne, potem po rdzeniu — odmienioną formę
   też chcemy rozpoznać, ale uczciwie oznaczyć jako domysł.
   Hasła wielowyrazowe pomijamy: pojedynczy token nigdy ich nie dopasuje,
   a w indeksie robiłyby tylko śmieci. */
const LOOKUP = (function () {
  const exact = new Map();
  const stems = new Map();
  for (const w of WORDS) {
    const n = normWord(w.ru);
    if (!n || n.includes(' ')) continue;
    if (!exact.has(n)) exact.set(n, w);
    if (n.length >= 5) {
      const st = n.slice(0, Math.max(4, n.length - 2));
      if (!stems.has(st)) stems.set(st, w);
    }
  }
  return { exact, stems };
})();

function lookup(token) {
  const n = normWord(token);
  if (!n) return null;
  if (LOOKUP.exact.has(n)) return { w: LOOKUP.exact.get(n), sure: true };
  for (let cut = 2; cut <= 3; cut++) {
    if (n.length - cut < 4) break;
    const st = n.slice(0, n.length - cut);
    if (LOOKUP.stems.has(st)) return { w: LOOKUP.stems.get(st), sure: false };
  }
  return null;
}

function viewReading() {
  const v = App.view;
  const r = ST().reading;

  v.innerHTML =
    head('Sprawdź, ile już rozumiesz', 'Czytelnia',
      'Wklej dowolny rosyjski tekst — piosenkę, wiadomość, fragment artykułu. Aplikacja pokaże, które słowa już masz w pamięci, a nieznane pozwoli dorzucić do powtórek jednym kliknięciem.') +
    '<div class="tiles">' +
      App.tile(r.texts, 'przerobionych tekstów', '', 'var(--amber)') +
      App.tile(r.added, 'słów dorzuconych', 'do kolejki powtórek', 'var(--jade)') +
    '</div>' +
    '<div class="editor">' +
      '<textarea id="rtext" rows="6" placeholder="Wklej tutaj rosyjski tekst…">' + esc(readText) + '</textarea>' +
      '<div style="display:flex;gap:9px;flex-wrap:wrap">' +
        '<button class="btn primary" data-act="analyze">Przeanalizuj</button>' +
        '<button class="btn ghost" data-act="clear-text">Wyczyść</button>' +
      '</div>' +
    '</div>' +
    '<div class="group-head"><h3>Gotowe teksty</h3><span class="d">na start, zanim wkleisz swój</span></div>' +
    '<div class="grid g3 stagger">' +
      READINGS.map((t) =>
        '<button class="cat" data-read="' + t.id + '">' +
          '<div class="cat-ru cyr">' + esc(t.title) + '</div>' +
          '<div class="cat-name">' + esc(t.pl) + '</div>' +
          '<div class="cat-stat"><span>poziom ' + t.lvl + '</span><span>' +
            t.text.split(/\s+/).length + ' słów</span></div>' +
        '</button>').join('') +
    '</div>' +
    '<div id="rout"></div>';

  v.addEventListener('click', (e) => {
    const rd = e.target.closest('[data-read]');
    if (rd) {
      const t = READINGS.find((x) => x.id === rd.dataset.read);
      readText = t.text;
      $('#rtext').value = t.text;
      analyze();
      return;
    }
    if (e.target.closest('[data-act="analyze"]')) { readText = $('#rtext').value; analyze(); }
    if (e.target.closest('[data-act="clear-text"]')) { readText = ''; $('#rtext').value = ''; $('#rout').innerHTML = ''; }
  });
}

function analyze() {
  const out = $('#rout');
  const text = readText.trim();
  if (!text) { out.innerHTML = '<div class="empty"><div class="g cyr">Ø</div>Najpierw wklej jakiś tekst.</div>'; return; }

  const tokens = text.split(/(\s+|[.,!?;:—«»()"\n])/);
  let known = 0, learning = 0, fresh = 0, unknown = 0;
  const freshWords = new Map();

  const html = tokens.map((tok) => {
    if (!/[а-яё]/i.test(tok)) return esc(tok).replace(/\n/g, '<br>');
    const hit = lookup(tok);
    if (!hit) { unknown++; return '<span class="tk out" data-w="' + esc(tok) + '">' + esc(tok) + '</span>'; }
    const w = hit.w;
    const c = ST().srs[w.id];
    let cls;
    if (Store.known(w.id)) { cls = 'know'; known++; }
    else if (c && c.s > 0) { cls = 'learn'; learning++; }
    else { cls = 'new'; fresh++; freshWords.set(w.id, w); }
    return '<span class="tk ' + cls + (hit.sure ? '' : ' guess') + '" data-id="' + w.id + '">' + esc(tok) + '</span>';
  }).join('');

  const total = known + learning + fresh + unknown;
  const pct = total ? Math.round(((known + learning) / total) * 100) : 0;

  out.innerHTML =
    '<div class="group-head"><h3>Tekst</h3><span class="d">kliknij słowo, żeby zobaczyć znaczenie</span></div>' +
    '<div class="readbar">' +
      '<div class="readbar-main">' + bar(pct, pct >= 70 ? 'green' : '') + '</div>' +
      '<div class="readbar-num"><span class="cyr">' + pct + '%</span> rozpoznanych</div>' +
    '</div>' +
    '<div class="readlegend">' +
      '<span><i class="tk know"></i> w pamięci: ' + known + '</span>' +
      '<span><i class="tk learn"></i> w trakcie: ' + learning + '</span>' +
      '<span><i class="tk new"></i> nowe ze słownika: ' + fresh + '</span>' +
      '<span><i class="tk out"></i> spoza bazy: ' + unknown + '</span>' +
    '</div>' +
    '<div class="readtext cyr" id="readtext">' + html + '</div>' +
    '<div id="wordpop"></div>' +
    (freshWords.size
      ? '<div class="now-actions"><button class="btn primary" data-act="add-fresh">' +
        'Ucz się ' + freshWords.size + ' nowych słów z tego tekstu →</button></div>'
      : '');

  const pop = $('#wordpop');
  $('#readtext').addEventListener('click', (e) => {
    const t = e.target.closest('.tk');
    if (!t) return;
    if (t.dataset.id) {
      const w = WORDS.find((x) => x.id === t.dataset.id);
      pop.innerHTML =
        '<div class="verdict ok"><div class="verdict-head cyr">' + esc(w.ru) + '</div>' +
        '<p>' + esc(w.pl) + ' · <span class="mono">' + esc(w.tr) + '</span></p>' +
        (w.ex ? '<div class="hint">' + esc(w.ex) + ' — ' + esc(w.exPl || '') + '</div>' : '') + '</div>';
      UI.speak(w);
    } else {
      const raw = t.dataset.w;
      pop.innerHTML =
        '<div class="verdict no"><div class="verdict-head cyr">' + esc(raw) + '</div>' +
        '<p>Tego słowa nie ma w bazie. Przybliżona wymowa: <span class="mono">' +
        esc(Speech.ruToPl(raw)) + '</span></p></div>';
      UI.speak({ ru: raw, tr: null });
    }
  });

  App.view.addEventListener('click', (e) => {
    if (!e.target.closest('[data-act="add-fresh"]')) return;
    const list = Array.from(freshWords.values());
    ST().reading.texts++;
    ST().reading.added += list.length;
    Store.bump('read');
    Store.commit();
    App.newSession({
      title: 'Słowa z tekstu',
      items: shuffle(list).map((w) => App.itemForWord(w)),
      repeat: null,
    });
  });
}

App.VIEWS.quests = viewQuests;
App.VIEWS.shop = viewShop;
App.VIEWS.keyboard = viewKeyboard;
App.VIEWS.sentences = viewSentences;
App.VIEWS.reading = viewReading;
App.KINDS.sentence = renderSentence;
})();
