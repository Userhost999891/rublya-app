<script>
/* Motyw ustawiamy przed pierwszym malowaniem, żeby na ciemnym systemie
   nie mrugnęło białe tło. Wybór użytkownika przychodzi później z bazy
   i nadpisuje tę wstępną decyzję. */
document.documentElement.dataset.theme =
  matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

/* Safari na iPhonie nie nadaje stanu :active przy dotknięciu, dopóki
   na dokumencie nie wisi choćby pusty nasłuch dotyku. Bez tego żaden
   przycisk się nie wciska — palec naciska, a nic się nie rusza. */
document.addEventListener('touchstart', function () {}, { passive: true });
</script>

<script>
/* Service worker działa tylko po HTTP(S) — przy otwarciu pliku z dysku
   aplikacja po prostu chodzi bez trybu offline, zamiast rzucać błędem.

   Nowa wersja workera musi wchodzić od razu. Wcześniej stary potrafił
   trzymać się miesiącami i podawać nieaktualny kod — telefon z ikoną
   na ekranie głównym rzadko kiedy zamyka wszystkie karty, a bez tego
   następca nigdy nie dochodził do głosu. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  var bylKontroler = !!navigator.serviceWorker.controller;
  var przeladowano = false;

  navigator.serviceWorker.addEventListener('controllerchange', function () {
    /* Pierwsze przejęcie po instalacji to nie jest aktualizacja —
       przeładowujemy tylko wtedy, gdy poprzednik ustąpił miejsca. */
    if (!bylKontroler || przeladowano) return;
    przeladowano = true;
    location.reload();
  });

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.update();
      reg.addEventListener('updatefound', function () {
        var nowy = reg.installing;
        if (!nowy) return;
        nowy.addEventListener('statechange', function () {
          if (nowy.state === 'installed' && navigator.serviceWorker.controller) {
            nowy.postMessage('przejmij');
          }
        });
      });
    }).catch(function () {});
  });
}
</script>
